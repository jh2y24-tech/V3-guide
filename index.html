   {q:"화장실·욕실·베란다(발코니) 바닥 전체를 방수하려고요",rec:["고뫄스","바르네 방수 완결"],why:"코너·드레인 취약부는 고뫄스로 보강, 바탕 액체방수는 바르네 완결. 발코니는 고뫄스로 전면방수하며, 위에 타일·몰탈 마감이 올라가는 비노출 방수입니다. 자세한 시공조건은 제품 상세내용을 참고하십시오."},
   {q:"옥상 슬라브 방수 좀 튼튼하게",rec:["하이고뫄스"],why:"신장율 1500%·고형분 82%의 KS 도막방수재. 복합5층으로 옥상·지하주차장 상부에 사용합니다. 위에 보호몰탈 등 마감이 올라가는 비노출 방수입니다."},
   {q:"몰탈·레미콘에 섞는 방수액 주세요",rec:["바르네 방수 완결","바르네 방수 완결 고농축","바르네 방수 급결"],why:"몰탈·콘크리트 혼합형 액체방수. 넓은 면적이면 물 60배 희석하는 고농축이 경제적. 지하실 벽에서 물이 새거나 차오르는 경우에는 규산소다계 급결형인 바르네 방수 급결로 안내합니다 — 균열·조인트 긴급 지수, 물 흐르는 부위 즉시 경화."},
   {q:"벽·홈통·창틀 균열에서 물이 새요",rec:["원씰 씰업 하이드로스탑 (투명/회색)"],why:"섬유보강 초탄성 도막방수제(신장률 500±50%). 프라이머 없이 시공하고 5mm까지 틈을 메웁니다. 시공 전 물기·오염·기존 방수제를 제거해야 하며, 물이 고인 곳에는 사용할 수 없습니다. 마감색을 살릴 곳은 투명(7250), 도막이 보여도 되는 곳은 회색(7270)."},
   {q:"타일·벽돌 안 뜯고 미세균열·틈새에 스며들게 방수하고 싶어요",rec:["브이텍 082 다용도침투방수제"],why:"실리콘 발수제와 폴리머 수성방수제를 결합한 다용도 침투 방수제입니다. 미세 균열에 깊이 침투해 타일을 뜯지 않고도 방수할 수 있어, 화장실·타일·석재·벽돌·창호 틈새, 베란다·보일러실·지하실, 옥상 바닥·건물 벽면 등에 안내합니다. 시공 전 물기를 말리고 배수구를 막은 뒤 10분간 여러 번 펼쳐 침투시키며, 누수가 심하면 1회 더 시공합니다. 완료 후 24시간 자연건조하고 그동안 물 사용을 금지하도록 안내하십시오."},
   {q:"베란다(실내)에 물이 새는데 냄새가 독하면 곤란해요",rec:["원씰 씰업 엘라스틱 화이트"],why:"무용제 초탄성 도막 방수제로 솔벤트가 없어 냄새가 거의 없어 환기가 어려운 실내에도 권장됩니다(환기 필수). 붓으로 한 번만 발라도 두꺼운 도막이 형성되고, 유광 흰 벽이면 방수 후 따로 칠하지 않아도 건조되며 자연스럽게 셀프레벨 처리됩니다. 방수제 위에는 수성 페인트만 도색할 수 있습니다(유성 불가). 냄새가 적을 뿐 실내 전용은 아니며, 화물차 윙바디·캠핑카·요트·선박 등 실외에도 사용합니다."},
   {q:"도구 없이 롤러로 바로 바르는 간편 방수제 / 좁은 부위 셀프 방수",rec:["조이픽스 35 롤러일체형 방수코팅제"],why:"뚜껑을 열고 롤러로 밀어 바르는 롤러 일체형 방수 코팅제입니다. 붓·트레이 등 별도 도구가 필요 없고 손에 묻거나 튈 걱정 없이 균일하게 도포되며 투명하게 마감됩니다. 한통(100g)으로 약 0.5㎡ 시공되는 소용량이라 창틀·새시 주변, 배수관 주변, 갈라진 벽면·누수 부위 등 좁은 부위 셀프 보수에 안내하십시오. 완전 경화(24시간) 후 한 번 더 도포하면 내구성이 좋아지고, 그 위에 수성페인트 도장도 가능합니다."},
   {q:"찢어진 천막 텐트를 테이프로 간단하게 보수하고 싶어요",rec:["천막보수테이프 (타포쉴드)","고릴라테이프"],why:"천막·텐트 보수용 초강력 점착(4,500g/25mm) 방수 테이프입니다. 뒷면 이형지를 떼고 붙이면 되고, 방수기능이 있어 외부에서도 쓰며 비·눈에도 문제없습니다. 배면처리가 되어 있어 흰색 위에 스프레이 락카·페인트로 천막 색상에 맞춰 도색할 수 있고, 가는 세로줄이 있어 손으로 쉽게 잘립니다. 천막·텐트 외 각종 보수·방수용으로도 안내하십시오. (80mm×4M · 원산지 일본)"},
   {q:"파이프·홈통·배수구에 감아 붙이는 방수 테이프 있나요",rec:["브이텍 슈퍼밴드 방수 테이프","고릴라테이프"],why:"특수 부틸고무를 강화 필름에 점착한 방수 테이프입니다. 벽·도기·배수구·천막·파이프·빗물 홈통 등의 방수에 쓰며, 이물질을 제거하고 길이에 맞게 재단해 이형지를 떼고 붙인 뒤 롤러·걸레로 압착합니다. 1mm 이상 벌어진 크랙은 먼저 메우고, 표면에 페인트 도색도 가능하다고 안내하십시오. (50mm×5M)"},
   {q:"강력한 다용도 보수 테이프 / 야외·배관·자동차·플라스틱을 튼튼하게 붙이거나 무타공 고정하고 싶어요",rec:["고릴라테이프"],why:"미국산 GORILLA TAPE입니다. 초강력 접착력과 내구성으로 야외 장비·캠핑용품·배관/호스·자동차·플라스틱 임시 보수와 무타공 고정에 두루 씁니다. 라인업은 기본 덕트 테이프(블랙·화이트·실버), 극한 날씨용 올웨더, 투명 마감 크리스탈 클리어, 물·공기·습기를 막는 방수테이프, 못 없이 고정하는 마운팅 양면테이프로 구성되니 용도·색상에 맞춰 안내하십시오. 표면 이물질을 제거하고 강하게 눌러 붙이며 가위 없이 손으로 자를 수 있고, 양면(마운팅) 테이프는 부착 24시간 후 최대 접착력이 나옵니다. 규격·사양은 상세 이미지를 참고하십시오."},
   {q:"실금·균열에 스며들어 메우는 탄성 방수본드 / 겨울에도 안 터지는 방수",rec:["엠비 탄성방수본드"],why:"균열에 침투해 접착하고 마른 뒤 메꿔 더 견고해지는 저점도 침투형 탄성 방수본드입니다. 고탄성력으로 재균열이 생겨도 잡아주고 -20℃ 저온에서도 유연성을 유지하며, 수성 기반이라 습한 지하에도 사용합니다. 옥상 바닥 균열, 방수페인트 들뜸, 코너·이음매, 벽돌·콘크리트 균열에 바로 짜서 도포하고 마른 후 1~2회 더 발라 마감하십시오. 실금은 물로 희석해 침투시키고, 1cm 이상 큰 크랙은 크림형(탄성방수크림)이 적합하다고 안내하십시오. 500ml로 약 한 평, 도포면적 2~7㎡/L, 색상 투명·회색·녹색."},
   {q:"벽면이나 큰 크랙(1cm 이상)에 흐르지 않게 떠발라 메우는 방수크림",rec:["엠비 탄성방수크림","엠비 탄성방수본드"],why:"흐르지 않는 고점도 크림형 탄성 방수제입니다. 균열에 침투·접착하고 마른 뒤 메꿔 견고해지며, 고탄성력으로 재균열도 잡고 -20℃ 저온에서도 유연성을 유지합니다. 고무 헤라로 떠서 벽면이나 큰 크랙(1cm 이상)에 밀어 넣어 시공하고, 백색이지만 마르면 투명해집니다. 바닥 실금·일반 크랙은 저점도 본드형(엠비 탄성방수본드)으로 침투시킨 뒤 큰 크랙은 크림으로 마감하면 더 튼튼합니다. 0.5L/1.2L, 도포면적 2~7㎡/L."},
   {q:"마루·벽지 깔기 전에 바닥 습기가 올라와요",rec:["드라이락 플로어 앤 월"],why:"마루 및 벽지 시공 전 습기 차단 방수용. 곰팡이 생성 방지 효과가 있는 유광·무색 투명 제품입니다. 2회칠 기준 약 8.4~9.3㎡, 재도장은 2시간 후."},
   {q:"콘크리트·조적 벽체에 바르는 방수제",rec:["씨카라스틱-215 드라이락"],why:"실내외 모두 시공 가능한 콘크리트·조적 구조물 방수제로 매끈한 무광 마감입니다. 지상·지하의 시멘트블록, 콘크리트블록, 스타코, 벽돌면에 사용하고 주방·욕실·벽체 인테리어나 DIY 방수에도 적합합니다. 15psi(지하 10m 수압 상당)까지 견디며 곰팡이 발생을 억제하고 백화를 완화합니다."},
   {q:"수영장·분수대·물탱크를 방수하려고요",rec:["씨카라스틱-215 드라이락"],why:"장시간 물이 담기는 환경에 적합한 방수제입니다. 노출 콘크리트 수영장, 분수대, 비음용수 저장탱크에 사용합니다. 15psi(지하 10m 수압 상당)에 견디고 곰팡이 발생을 억제합니다. 담수(물 채우기)는 시공 후 7일 이상 지난 뒤에 하도록 안내하십시오."},
   {q:"방수 전에 바르는 밑작업재",rec:["아스프라 L"],why:"아스팔트 프라이머. 접착력·방습을 높이고 방수시트 접착에도 사용."},
   {q:"간단하게 옥상 방수층 보수할 수 있나요?",rec:["짜서 쓰는 틈새 방수제","우레탄 보수용 방수제"],why:"옥상 방수층을 간단히 보수하는 조합입니다. 크랙·균열은 짜서 쓰는 틈새 방수제(튜브형)를 잘 흔들어 크랙에 스며들도록 반복해 짜 넣어 충진하고, 들뜨거나 벗겨진 기존 우레탄 코팅 부위는 우레탄 보수용 방수제(1액형·하도·중도·상도 불필요)를 붓·롤러로 2~3회 발라 마감하십시오. 둘 다 수용성 무취 제품으로 물·염분·자외선 내후성이 좋고, 크랙이 깊거나 부위가 넓으면 방수포와 함께 사용하십시오. 각 150ml·500ml."}
 ,
   {q:"타일 붙이기 전에 바르는 무기질(시멘트계) 방수재 주세요",rec:["메딕","에코코트"],why:"대로방수화학 시멘트 기반 탄성 도막 방수재입니다. 습윤면 시공이 가능하고 타일·시멘트 바닥과 부착이 좋아 욕실·화장실 타일 밑 비노출 방수에 씁니다. 일반 부위는 메딕(9kg/set·0.4kg/㎡), 노출옥상처럼 탄성이 더 필요하거나 지하·물탱크·수영장·정수장이면 에코코트(18kg/set)로 안내합니다. 시공 전 V-100 바탕강화제로 밑작업하십시오."},
   {q:"옥상 물매 잡고 견출도 하려는데 강한 몰탈 방수재",rec:["폴리머 파워 플러스","V-100 바탕강화제"],why:"접착력·강도가 높은 시멘트 기반 폴리머 방수재로 옥상 물매, 공장·주차장 바닥, 보호몰탈(방통), 내외벽 견출에 사용합니다. 3mm 기준 4.5kg/㎡이며 우레탄·에폭시 위에도 작업 가능합니다. 루프코트 시공 전 바탕처리에도 씁니다."},
   {q:"옥상·베란다에 수성으로 방수하고 싶어요",rec:["V-100 바탕강화제","그린코트","삼화 원터치 방수"],why:"수성(수용성)으로 옥상·베란다를 방수하는 제품입니다. 방수 전 노후·부실한 바닥은 V-100 바탕강화제(0.3L/㎡)로 1차 도포해 부착력을 높이십시오. 도막방수는 그린코트(1액형 아크릴 고무계 크림 타입 수용성 탄성 도막방수재)로, 냄새·독성이 적고 습윤면 시공이 가능해 초보 시공에 적합합니다(0.5kg/㎡, 녹색·회색). 한 통으로 하도·중도·상도까지 간편하게 끝내려면 삼화 원터치 방수(1액형 수용성 아크릴에멀젼화 우레탄 방수도료)로 안내하십시오. 경사가 완만한 지붕·평슬라브 옥상 노출 방수용이며 28일 이상 양생된 콘크리트에 시공합니다."},
   {q:"판넬 컨테이너 징크 지붕에 방수,차열,녹방지되는게 있나요?",rec:["넬-코트"],why:"판넬·징크(철판) 지붕 전용 차열·단열·부식방지 코팅 방수재입니다. 프라이머 0.3kg/㎡ 후 넬코트 약 0.5kg/㎡로 시공하며 수용성·무취라 냄새 부담이 적습니다."},
   {q:"슁글·슬레이트·기와 지붕 방수 / 적벽돌 방수페인트",rec:["루프코트","비트코트"],why:"색을 입히면서 방수하려면 루프코트(적갈색·녹색, 0.4kg/㎡), 벽돌 본연의 색을 그대로 살리려면 투명 코팅제인 비트코트로 안내합니다. 비트코트는 프라이머 없이 바로 시공하고 수성페인트와 혼합해 방수+도장을 동시에 할 수 있습니다."},
   {q:"기존 타일 안 뜯고 욕실 방수하고 싶어요",rec:["투게더"],why:"침투형 방수재로 철거 없이 욕실 바닥·타일메지·크랙 부위에 도포해 미세공극에 침투시킵니다. 약 0.3L/㎡, 항균제가 첨가되어 있습니다. 도막을 형성하는 방수가 아니므로 물이 새는 정도가 심하면 도막방수(메딕·그린코트)로 안내하십시오."},
   {q:"콘크리트가 삭았는데 강화하면서 방수도 되게",rec:["고침투 방수재","V-100 바탕강화제"],why:"노후 콘크리트 미세균열에 침투해 표면 강도와 내마모성을 높이는 무기질 침투형 방수재(약 0.3L/㎡)입니다. 방수 시공 전 바탕면 강화가 목적이면 V-100 바탕강화제를 1차로 도포하십시오."},
   {q:"외벽 벽돌에 물 안 스며들게만 하고 싶어요 (색은 그대로)",rec:["웰스코트"],why:"친환경 수용성 발수제로 건조 후 투명하게 마감되어 기존 색상을 보존합니다. 통기성이 있어 내·외부 콘크리트, 적벽돌, 목조주택 외벽에 사용하며 0.3L/㎡입니다."},
   {q:"레미콘에 섞는 구체방수재 있나요",rec:["구체방수재"],why:"레미콘 혼입용 구체방수재입니다. 18L로 콘크리트 6㎥ 기준이며 지하옹벽·기초, 수영장·정화조·폐수처리장, 터널·교량·방파제 등에 사용합니다. 철근 부식 방지와 수밀성 강화 효과가 있습니다."},
   {q:"지하주차장에서 물이 새는데 인젝션(주입) 해야 할 것 같아요",rec:["R-750","R-505"],why:"팩커를 박고 주입하는 폴리우레탄 발포 지수제는 R-750(10·20kg)으로, 물을 만나면 발포해 즉시 차수합니다. 균열을 메워 구조를 보강하는 목적이면 주사기로 주입하는 에폭시 그라우팅제 R-505(주제10kg+경화제5kg)로 안내합니다. 진동이 있는 구조물·이어치기 조인트 누수는 R-750입니다."},
   {q:"창틀 주위나 메지 크랙을 크림처럼 발라 막고 싶어요",rec:["퍼터-씰","떠바르는 방수제"],why:"대로방수화학 퍼터-씰은 침투형 아크릴 크림 타입 실링제로 창틀 실리콘 주위, 바닥 크랙, 코너 조인트, 타일·적벽돌 메지 충진에 씁니다(백색·녹색·회색, 2·4kg). 시공 후 12시간 내 물 접촉을 피하고 완전경화는 72시간입니다."},
   {q:"방수하기 전에 바닥에 먼저 뭘 발라야 하나요",rec:["V-100 바탕강화제"],why:"대로방수화학 방수 시공의 공통 1차 작업용 프라이머입니다. 노후·부실한 콘크리트면을 강화하고 방수재 부착력을 높입니다. 0.3L/㎡이며 옥상·창고·주차장 바닥 방수 전에 도포합니다."},
   {q:"옥상 우레탄 방수 자재 한 세트로 주세요 (삼화)",rec:["방수에이스 하도","방수에이스 중도","방수에이스 상도"],why:"삼화페인트 노출 우레탄 방수 3종 세트입니다. 하도(프라이머) → 중도(우레탄 도막) → 상도(자외선 보호) 순서로 시공하며, 중도만 두껍게 바르고 상도를 생략하면 자외선에 도막이 상하므로 반드시 상도까지 안내하십시오. 위에 마감이 올라가는 비노출이면 비노출 방수에이스 2류로 구분합니다."},
   {q:"위에 몰탈이나 타일이 올라가는 비노출 방수요",rec:["비노출 방수에이스 2류(KSF3211)","방수에이스 하도"],why:"KS F 3211 규격 비노출용 우레탄 방수재입니다. 보호몰탈·타일 등 마감이 덮이는 부위에 사용하며, 바탕면에는 방수에이스 하도로 먼저 프라이머 처리합니다."},
   {q:"한 통으로 간단히 옥상 방수하고 싶어요",rec:["삼화 원터치 방수"],why:"1액형 수용성 아크릴에멀젼화 우레탄 방수도료로, 이 제품 하나로 하도·중도·상도를 모두 시공합니다. 경사가 완만한 지붕·평슬라브 옥상 노출 방수용이며(피도면은 28일 이상 양생된 콘크리트), 소면적 보수나 간편 시공에 안내합니다. 넓은 면적·내구성이 중요한 현장은 방수에이스 3종 세트로 안내하십시오."},
   {q:"천장이나 벽에서 물이 새는 자국이 있어요",rec:["안심누수"],why:"누수 부위 보수용 삼화 제품입니다. 다만 누수는 원인부(상부·외벽·배관)를 먼저 잡아야 하므로, 실내 도장만으로 해결되지 않는다는 점을 반드시 설명하십시오."},
   {q:"크랙이나 줄눈에 발라서 막는 방수제 없나요",rec:["떠바르는 방수제","짜서 쓰는 틈새 방수제"],why:"크림형 떠바르는 방수제는 콘크리트 크랙·타일 메지·건물 코너·벽돌 균열처럼 면으로 펴 바르는 부위에, 튜브형 짜서 쓰는 틈새 방수제는 좁은 균열·창틀 틈·판넬 이음처럼 짜 넣는 부위에 안내합니다. 둘 다 수용성 무취 무독성이며, 크랙이 깊거나 면적이 넓으면 방수포와 함께 사용하십시오."},
   {q:"옥상 우레탄이 들뜨고 벗겨졌어요",rec:["우레탄 보수용 방수제"],why:"기존 우레탄·에폭시 방수층이 들뜨거나 벗겨진 부위 재시공용 1액형 방수제입니다. 하도·중도·상도 구분 없이 한 제품으로 보수할 수 있어 부분 보수에 적합합니다."}
   ,{q:"콘크리트 포장도로·바닥 조인트(수축·팽창 줄눈)를 흐름성으로 실링하고 싶어요",rec:["DS-7000(SL) 흐름성 폴리우레탄 실란트"],why:"셀프레벨링(흐름성) 2액형 폴리우레탄 실란트입니다. 흐름성이 있어 바닥 조인트에 흘려 넣어 채우며 콘크리트 포장도로의 수축·팽창 줄눈 실링에 적합합니다. 주제:경화제=1:5로 균일하게 혼합해 사용가능시간(1~5시간) 내에 시공하고, 움직임 허용치 ±25%·최대신율 700~800%로 거동에 대응합니다. 표면경화 24시간·완전경화 7~14일이며 KS F 4910을 충족합니다. 피착재 재질에 따라 부착력 차이가 있으니 사전 접착력 시험을 안내하십시오. (주제 2kg·경화제 10kg, 회색)"}
   ,{q:"건축·토목 조인트나 PC·ALC판넬 접합부·창호 주변을 폴리우레탄으로 실링하고 싶어요",rec:["DS-7000(N) 폴리우레탄 실란트"],why:"건축·토목공사에 범용으로 쓰는 2액형 폴리우레탄 실란트입니다. 흐름성이 없어 수직·접합부 실링에 적합하며 토목·건축 각종 조인트, PC·ALC판넬 접합부, 창호 주변 실링에 안내합니다. 고신율·저 모듀러스로 움직임 허용치 ±25%, KS F 4910 충족, 환경부 실내공기질 관리법 적합 제품입니다. 주제:경화제=1:5 혼합, 완전경화 7~14일. 도장 가능하나 페인트·시공방법에 따라 도장 불량·이색이 생길 수 있으니 테스트 후 시공하도록 안내하십시오. (주제 2kg·경화제 10kg, 백색·회색 주문색 가능)"}
   ,{q:"옥상 우레탄 방수 전에 크랙·조인트를 실링할 건데 변성실리콘 써도 되나요",rec:["DAWOOSIL PU 777 폴리우레탄 실란트"],why:"옥상 우레탄 방수 시에는 변성실리콘을 사용하지 말고 우레탄 실란트인 DAWOOSIL PU 777로 크랙 보수·조인트 실링·방수 전처리 보수를 하도록 안내하십시오. 1액형 습기경화형이라 카트리지 건으로 바로 충전해 작업이 간편하고 방수제·페인트와 호환성이 좋습니다. 표면경화 6시간(23℃, 50%RH)·완전경화 7~15일, 경도 15~30·최대신율 400~600%. 백색·회색, 300ml 카트리지."}
   ,{q:"콘크리트 크랙·조인트를 1액형 카트리지 실란트로 간편하게 실링하고 싶어요",rec:["DAWOOSIL PU 777 폴리우레탄 실란트"],why:"1액형 습기경화형 폴리우레탄 실란트입니다. 별도 혼합 없이 카트리지로 바로 충전해 방수/바닥 공사 전 보수 실링, 콘크리트 크랙 보수·조인트 실링, 건축·토목 각종 조인트, 방수제·페인트 전처리 보수에 씁니다. 방수제·페인트와 호환성이 좋아 방수 도막 전처리에 적합하며(도장은 페인트 종류·시공방법에 따라 불량·이색이 있을 수 있으니 테스트 후), 피착면 접착성이 우수합니다. 백색·회색, 300ml 카트리지."}
   ,{q:"우레탄·실리콘 실란트 시공 전에 접착력 높이는 프라이머 있나요",rec:["DAWOOSIL 프라이머 (우레탄용 DS-100 / 실리콘용 DS-200)"],why:"1액형 습기경화 실란트 프라이머입니다. 피착면 이물질을 완전히 제거한 뒤 붓·롤러·스프레이로 도포해 실란트 접착력을 높입니다. 우레탄 실란트에는 DS-100, 실리콘 실란트에는 DS-200을 사용하도록 안내하십시오. 바르고 1~2시간 건조 후 실란트를 시공하며(숙련 시공자는 도포 직후 바로 시공하기도 함), 기온 5℃ 이하·상대습도 85% 이상에서는 사용을 금합니다. 지촉건조 1시간 이내·완전경화 24시간 이내(20℃), 매장은 1L·4L 취급."}
 ]},
 {g:"외단열 · 외벽 마감",items:[
   {q:"스티로폼·아이소핑크 단열재 붙일 본드",rec:["유승 G2 본드","유승몰탈","스치로본드 수퍼"],why:"몰탈면 점(스포트) 부착은 G2 본드, 시멘트 혼합 부착·바탕바름은 유승몰탈/스치로본드."},
   {q:"외벽 스타코·드라이비트 마감재",rec:["테라코트 수퍼화인","테라코트 엑셀","테라코트 데코","테라코트 그래뉼"],why:"준불연 외벽 텍스쳐 마감. 질감으로 선택 — 고운 수퍼화인/화인 엑셀/굵은 스프레이 데코/알갱이 질감 그래뉼(주문품)."},
   {q:"단열 위에 까는 메쉬·코너 보강재",rec:["테라코 일반메쉬","테라코 코너비드"],why:"내알칼리 유리섬유 메쉬로 바탕면을 보호하고, 단열재 모서리는 PVC 코너비드로 파손을 방지합니다."},
   {q:"황토로 벽 마감하고 싶어요",rec:["황토핸디코트 내부","황토핸디코트 외부"],why:"친환경 황토 마감. 실내는 원적외선 내부용, 실외는 내수·내오염 외부용."}
 ]},
 {g:"타일 · 석재",items:[
   {q:"타일이 들떠서 딸깍거리는데 뜯지 않고 틈에 주입해 재접착·보수하고 싶어요",rec:["조이픽스 강력 타일 접착 보수제 (JOYFIX 37)"],why:"노즐로 타일 하부 공극(틈)에 깊숙이 스며드는 침투형 액상 접착 보수제입니다. 타일·석재·목재 등 흡수성 표면에 쓰고 금속·유리·플라스틱 등 매끄러운 재질에는 권장하지 않습니다. 도포 후 약 10분부터 초기 고정되고 최소 12시간 건조·완전 경화 24~72시간이며, 경화 전까지 수분·동결·외부 접촉을 피하도록 안내하십시오. 바닥은 무거운 물체로, 벽면은 노즐을 기울여 깊이 주입한 뒤 테이프로 밀착 고정하면 흘러내림 없이 시공됩니다."},
   {q:"타일 시공 순서대로 제품 한 세트로 주세요 (아덱스)",rec:["ARDEX E 660","ARDEX WPM 003","ARDEX X 18","ARDEX FG 4"],why:"한국아덱스 4단계 표준 순서입니다. ①바탕 전처리 — 흡수면은 E 660, 비흡수면은 P 4 K 프라이머. ②방수 — 취약부 실리콘 실링 → SK 90 테이프로 코너 보강 → WPM 003 2회 도포. ③접착 — X 18(대형·고탄성) 또는 D 30(일액형). ④줄눈·마감 — FG 4 계열 줄눈 후 SN PLUS 하이진 실리콘. 전처리를 건너뛰면 접착력이 크게 떨어진다고 안내하십시오."},
   {q:"욕실·발코니 타일 위에 방수하려는데 아덱스로 주세요",rec:["ARDEX P 4 K","ARDEX WPM 003","ARDEX SK 90 / SK 90 INCORNER"],why:"기존 타일 등 비흡수면 위에 시공할 때는 일액형 비흡수면 프라이머 P 4 K로 먼저 바탕을 처리해 부착력을 확보합니다(기존 타일면 Tile-on-Tile 프라이밍). 그 위에 WPM 003(타일 전용 일액형 탄성 도막 방수제)을 바르는데, 별도 혼합 없이 사용하고 4시간(23℃) 건조 후 방수면에 바로 타일을 붙일 수 있으며 규사 살포가 필요 없습니다. 냄새가 거의 없어 실내에 적합하고 석고보드·합판 방수도 가능합니다. 코너·드레인 등 취약부는 SK 90 방수테이프(코너는 INCORNER)로 먼저 보강하십시오. 외부·옥상 노출 부위는 WPM 003 ROOFTOP으로 안내합니다."},
   {q:"대형 타일이라 잘 붙는 접착제가 필요해요",rec:["ARDEX X 18 Premium","ARDEX X 18","ARDEX D 30"],why:"섬유보강 고탄성 타일 접착제입니다. 대형·고중량 타일이나 까다로운 바탕이면 X 18 Premium, 일반 대형 타일은 X 18로 안내합니다. 소규모 보수나 혼합 없이 바로 쓰려면 일액형 D 30, 빨리 굳혀야 하면 QUICKBOND(초속경)입니다."},
   {q:"바닥에 크랙이 있는데 타일이 또 깨질까 걱정돼요",rec:["디커플링 매트 (크랙 아이솔레이션)","ARDEX A 45"],why:"콘크리트 균열이 타일로 전달되는 것을 차단하는 절연 매트입니다(독일 직수입). 균열·파손부 자체를 메워야 하면 초속경 고강도 무수축 보수 몰탈 A 45로 먼저 보수하고, 바닥이 고르지 않으면 타일 전용 자동수평몰탈 LQ 92로 잡습니다."},
   {q:"줄눈 색 맞추고 오염 안 되게 하고 싶어요",rec:["ARDEX FG 4","ARDEX FG 4 PLUS","ARDEX EG 15"],why:"일반 시멘트계 칼라 줄눈은 FG 4, 탄성·발수 성능이 더 필요하면 FG 4 PLUS로 안내합니다. 오염이 심하거나 화학 저항이 필요한 주방·상업 공간은 세척이 쉬운 에폭시 줄눈 EG 15입니다."},
   {q:"타일 마감 실리콘은 뭘로 쏘나요",rec:["ARDEX SN PLUS","ARDEX SN PLUS MATT"],why:"곰팡이에 강한 하이진 실리콘 실란트로 줄눈 색과 맞춰 14가지 색상 중 고를 수 있습니다. 무광 타일·무광 줄눈에는 SN PLUS MATT로 안내하십시오. 방수 전 취약부 사전 실링에도 같은 제품을 씁니다."},
   {q:"타일 붙이기 전에 바탕에 뭘 발라야 하나요 (아덱스)",rec:["ARDEX E 660","ARDEX P 4 K"],why:"바탕면 흡수 여부로 나눕니다. 콘크리트·몰탈·석고보드처럼 물을 빨아들이는 흡수면은 멀티 프라이머 E 660, 기존 타일·에폭시·금속처럼 물을 안 먹는 비흡수면은 일액형 P 4 K입니다."},
   {q:"실내 도자기 타일 붙이는 본드",rec:["테라픽스 P21"],why:"친환경 도자기질 타일접착제(타입 III). 오픈타임 약 25분, 석고보드·ALC 바탕 가능."},
   {q:"실내외 겸용 타일접착제 / 기존 타일 위에 덧붙이고 싶어요",rec:["테라코 F22"],why:"드라이본드형 고성능 타일접착제. 실내외 바닥·벽의 도기질·자기질·폴리싱 타일과 석재, 지하철 등 진동 부위, 기존 타일 위 시공까지 가능하며 시공 두께는 최대 10mm입니다. 수영장·저수조 타일은 시공 후 28일이 지난 뒤 물을 채웁니다. 다만 합판·판넬·MDF·PB·갈바·스테인레스·노출우레탄방수 면에는 시공할 수 없고, 고흡수성 ALC는 P-프라이머 선처리가 필요합니다. 시공온도 5~35℃, 가수량 5.5~6.0L/20kg을 지키지 않으면 하자가 생길 수 있습니다."},
   {q:"자기질·폴리싱 타일 / 인조대리석",rec:["에피록"],why:"2액형 수용성 에폭시 접착제. 흡수 안 되는 자기질·폴리싱에 강력 접착."},
   {q:"대리석(석재) 붙이는 접착제",rec:["에포스톤"],why:"에폭시 2액형 석재용. 대리석 접착 및 철재 앙카 씰링, 부착가능 10분."},
   {q:"욕실 벽타일 떠붙임으로 할 몰탈",rec:["타일떠붙임용 레미탈"],why:"내벽 도기질타일 떠붙임 전용 레디믹스 몰탈. 현장 배합 없이 물만 부어 쓰며 재래식 배합보다 부착력이 좋습니다."},
   {q:"타일 줄눈(메지) 넣을 제품",rec:["테라그라우트 G11","테라코 칼라라인 (내장)"],why:"넓은 면적·현장용은 테라그라우트 G11(20kg당 물 5.6~6.4L, 가사시간 약 60분). 가정용 소량 보수는 소포장 칼라라인으로 색 맞춰 안내."},
   {q:"타일 줄눈·몰탈 접착 좋게 하는 것",rec:["몰타론7000","몰다인 2000·3000·5000","바르는 몰탈접착증강제"],why:"셋 다 몰탈 접착을 강화하는 제품으로 용도가 겹칩니다. 몰타론7000은 초산비닐계 수성 에멀션으로 몰탈 크랙 방지·접착 강화와 석고보드 프라이머까지 사용합니다. 몰다인은 물 배합비에 따라 2000·3000·5000으로 등급이 나뉘며, 목재·철판·PC판 조인트 등 특수 바탕면에는 5000을 안내합니다. 바르는 몰탈접착증강제(올바른산업)는 1L 소포장으로 수평·무수축·초속경몰탈 접착이나 소규모 보수 작업에 안내하기 좋습니다. 셋 모두 도포 공법과 혼합 공법이 가능하며 바탕면 이물질 제거가 선행돼야 합니다."},
   {q:"타일이 깨졌는데 티 안 나게 보수하고 싶어요",rec:["케미컬 코크 미니"],why:"케미컬 코크 미니는 목재·몰딩·틈새용이지만 데코타일 틈이나 타일 표면의 깨짐·금에도 색을 맞춰 티 안 나게 메우는 용도로 쓸 수 있습니다. 15색 중 타일 색에 맞춰 고르거나 2색을 섞어 조색하고, 굳으면 조금 어두워지므로 살짝 밝은 색을 권하십시오. (직원 참고: 타일 전용 보수 사례는 아래 링크 참고)",ref:{label:"타일 깨짐·금 보수 참고 (스마트스토어)",url:"https://smartstore.naver.com/ucus01/products/11991250063"}}
 
   ,{q:"폴리싱타일 바닥 찌든때·오염 닦는 전용 세정제 있어요",rec:["엑스트라 크린 (폴리싱타일 전용 세정제)"],why:"폴리싱타일 표면의 찌든때와 일반 오염을 빠른 침투·분해력으로 제거하는 폴리싱타일 전용 특수 세척제입니다. 오염 정도에 따라 원액 1:물 10~50배로 희석해 바닥에 바르고, 부드러운 패드·솔로 문질러 제거한 뒤 깨끗한 마포로 완전히 닦아내도록 안내하십시오. 세정 후 폴리싱타일 전용 광택제(엑스트라)를 시공하면 광택이 더 오래 유지됩니다. 약알칼리성 원액, 1L·3.75L·18.75L."}
 
   ,{q:"대리석·화강석 석재 바닥 일상 청소(세정)하는 전용 세정제 있어요",rec:["스톤 클리너 Stone Cleaner (석재 바닥 일상 세정제)"],why:"대리석·화강석·세라믹 바닥 전용 일상관리 세정제입니다. 돌바닥 손상을 최소화하면서 오염을 효과적으로 제거합니다. 작업 전 기본 오염을 청소하고, 용액을 바닥에 소량 뿌린 뒤 솔로 문질러 닦은 다음 물로 헹구거나 닦아내도록 안내하십시오. 환기가 잘 되게 창문·문을 열고 작업하고, 석재 이외 용도로는 사용하지 않습니다. (폴리싱타일은 엑스트라 크린으로 안내) 3.75L(6ea)."}
 ]},
 {g:"바닥 수평 · 미장 · 조적",items:[
   {q:"주차장·공장 바닥에서 먼지가 날려요 (방진)",rec:["엑티원"],why:"침투식 액상 하드너로 실내 바닥을 강화해 방진 처리합니다. 방수재가 아니며 아파트 주차장·공장·창고·마트 바닥용입니다. 1회 약 0.3L/㎡, 2회 약 0.2L/㎡로 도포해 영구적 강화층을 만듭니다."},
   {q:"기존 콘크리트에 새 몰탈을 붙이려는데 들뜰까 걱정돼요",rec:["몰드-인","바르는 몰탈접착증강제"],why:"대로방수화학 몰드-인은 신·구 콘크리트와 몰탈(레미탈)을 접착하는 프라이머형 접착제입니다(0.2~0.4L/㎡). 수평몰탈·무수축몰탈·초속경몰탈 접착, 석고보드·목재 접착에도 사용합니다."},
   {q:"바닥이 울퉁불퉁한데 평평하게 만들고 싶어요",rec:["자동수평몰탈 SL15 · 프라이머"],why:"스스로 수평을 잡는 실내 전용 자동수평재(시공두께 5~20mm). 전용 SL 프라이머를 먼저 발라야 부착력·흐름성이 좋고 기포가 생기지 않습니다."},
   {q:"외부 바닥인데 자동수평 되나요 / 균열이 걱정돼요",rec:["콘패치 SL"],why:"시멘트에 유기재의 연성을 더해 온도변화·수축 저항을 높인 제품. 실내 전용 SL재를 쓰기 어려운 외부·균열 우려 부위에 사용."},
   {q:"기계기초·앵커볼트 밑을 채워야 해요",rec:["무수축 레미탈 GP400"],why:"물만 부어 쓰는 무수축 그라우트(KS F 4044). 고강도·고유동성으로 기계기초, 철골기초, 교량 교좌장치, PC 조인트 충진에 사용."},
   {q:"벽 미장할 몰탈 주세요",rec:["레미탈 (25kg·40kg)"],why:"미장용 레디믹스 모르타르(KS L 5220). 현장 배합 없이 물만 부어 쓰며, 프리미엄 25kg과 일반 40kg 규격을 용도·예산에 맞춰 안내."},
   {q:"조금만 보수할 건데 시멘트 반죽하기 번거로워요",rec:["바우어 접착시멘트 (폴리머 시멘트)"],why:"봉지를 잘라 바로 짜서 쓰는 사전 혼합형 폴리머 시멘트. 타일·줄눈 부분 보수, 벽 크랙·구멍 메움, 벽돌·블록 고정에 사용하며 초기 강도가 강해 수직면에도 바로 붙습니다. 두께는 최대 2cm 이하로만 시공하고(두꺼우면 크랙 발생), 완전 건조에 48시간·기후에 따라 최대 72시간이 걸립니다. 덧발라야 할 때는 완전 건조 후에 하고 직사광선은 피하십시오. 경화 후 수성·유성 페인트 도색이 모두 가능합니다."}
 ,
   {q:"바닥이 쩍쩍 갈라졌는데 뭘로 메우나요 (콘크리트 · 아스팔트)",rec:["콘크리트 드라이 크랙필러","아스팔트 드라이 크랙필러"],why:"두 제품 모두 분말을 크랙에 붓고 물만 뿌리면 경화하는 미국산 크랙필러이지만, 바탕면에 따라 반드시 구분해서 안내해야 합니다. 회색 콘크리트 바닥·보도블록·콘크리트 조인트에는 콘크리트용을, 검은색 아스팔트 도로·주차장 바닥에는 아스팔트용을 안내하십시오. 서로 바꿔 쓰면 색이 맞지 않고 접착도 제대로 되지 않습니다. 먼저 손님께 바닥이 콘크리트인지 아스팔트인지 확인하십시오. 크랙 폭은 헤어라인부터 가능하며, 아스팔트용은 최대 2인치(약 5cm) 폭까지 충진할 수 있습니다."}
 ]},
 {g:"내부 벽면 · 석고보드 · 퍼티",items:[
   {q:"벽에 곰팡이가 계속 올라와요",rec:["아이럭스 결로스탑규조토"],why:"규조토 성분으로 실내 표면 결로를 흡수했다가 서서히 방출해 결로를 완화하고, 도막 위 곰팡이 생성도 억제하는 기능성 수성페인트입니다. 곰팡이는 원인이 습기이므로 환기·단열 개선을 함께 안내하고, 이미 생긴 곰팡이는 살균 처리한 뒤 도장하도록 설명하십시오."},
   {q:"실내 벽 페인트 추천해 주세요 (삼화)",rec:["아이럭스 멀티플랫","아이럭스 듀로X","아이럭스 멀티에그쉘","아이생각 원코트","홈스타파스텔OK플러스","아이생각수성내부프로","아이생각수성아크론"],why:"광택·용도로 나눕니다. 완전 무광은 멀티플랫(천장·벽 무난), 살짝 광이 있고 닦이는 것은 멀티에그쉘(복도·주방)입니다. 흠집·오염에 강한 고강도 무광은 듀로X(항균·곰팡이 억제). 높은 은폐력으로 1회 도장 마무리는 아이생각 원코트, 은은한 파스텔 질감은 홈스타파스텔OK플러스, 일반 실내 벽 범용은 아이생각수성내부프로입니다. 고광택에 낙서방지가 필요하면 아이생각수성아크론(반광 이상)으로 안내합니다. 오염이 잦은 곳은 에그쉘 이상 광택으로 권하십시오."},
   {q:"실크벽지 위에 그냥 칠해도 되나요",rec:["아이럭스 멀티플랫","아이럭스 결로스탑규조토"],why:"실크벽지·시트지는 표면이 코팅돼 있어 아무 수성이나 잘 붙지 않습니다. 아이럭스 멀티플랫과 아이럭스 결로스탑규조토는 별도 하도 없이 실크벽지 위에 바로 도장할 수 있어 이 상황에 안내합니다. 다만 결로스탑규조토는 도포량이 리터당 약 3.9㎡로 적어 넓은 면적에는 비경제적이라는 점을 함께 설명하고, 들뜨거나 벗겨진 벽지는 제거 후 도장하도록 안내하십시오. 홈스타파스텔OK플러스처럼 파워젯소 하도가 전제되는 미장용 제품은 실크벽지 위 직접 도장에는 권하지 않습니다."},
   {q:"페인트 칠하기 전에 밑작업(젯소·바인더) 뭘 쓰나요",rec:["파워젯소","수성바인다200"],why:"기존 색을 덮고 부착을 높이는 하도는 파워젯소, 분필처럼 가루가 날리는 노후 면·백화면을 굳혀 잡을 때는 수성바인다200으로 안내합니다."},
   {q:"내구성 좋은 벽 마감재 / 오염에 강한 도료",rec:["아이럭스 듀로X","아이럭스 올코팅"],why:"마모·오염에 강한 삼화 실내용 도료입니다. 사람 손이 자주 닿는 복도·상가·학교 벽처럼 관리가 잦은 곳에 안내합니다."},
   {q:"베란다·지하실 벽에 곰팡이랑 결로가 심해요",rec:["곰팡이 결로방지 단열 도료 (수용성 결로단열)","핸디코트 결로방지퍼티"],why:"대로방수화학 무기질 세라믹 단열 도료로 벽·천장에 도장해 단열·항균·곰팡이 방지 효과를 냅니다(백색, 약 0.5L/㎡). 방수 기능은 없으므로 누수가 원인이면 방수 상황으로 안내하고, 퍼티로 두께를 잡아 결로를 잡으려면 핸디코트 결로방지퍼티와 비교해 주십시오."},
   {q:"석고보드 이음매(조인트) 처리",rec:["핸디코트 에코라이프","테라코 종이테이프","테라코 천테이프","화이바테이프 (울트라씬 테이프)"],why:"이음부에 핸디코트를 먼저 바르고 테이프를 얹은 뒤 그 위에 다시 핸디코트를 덧발라 묻어줍니다. 종이테이프·천테이프는 접착력이 없는 비접착 제품이라 반드시 이 방식으로 시공하며, 면을 잡아주고 석고보드 사이가 벌어지는 것을 막아줍니다. 천테이프는 직조 테이프로 석고보드·합판·판넬 이음부 처리와 크랙 보수·보강에 사용합니다. 조인트 콤파운드는 물 없이 그대로 사용하십시오."},
   {q:"벽 전체 퍼티(올퍼티) 칠 전에",rec:["아크릴릭필러 E","핸디코트 워셔블"],why:"평활도용 올퍼티. 내외부 겸용 필러 E, 내수성 필요하면 준내부 워셔블."},
   {q:"외부 벽 크랙 메우는 퍼티 있나요",rec:["아크릴릭필러 E"],why:"내외부 겸용 필러로, 외부 콘크리트·시멘트·석고플라스터·CRC보드면의 크랙 보수와 올퍼티에 사용할 수 있습니다. 내부 전용 퍼티를 외부에 쓰지 않도록 구분해 안내하십시오."},
   {q:"결로·곰팡이 생기는 벽 잡고 싶어요",rec:["핸디코트 결로방지퍼티"],why:"다공성 경량 필러로 결로 저항·곰팡이 저항. 외벽 안쪽에 최대 5mm 시공."},
   {q:"석고보드 코너(모서리) 조인트 보강",rec:["테라코 코너테이프"],why:"실내 석고보드·ALC·합판·몰탈면의 모서리에 퍼티·조인트 작업 시 각을 잡아 보강하는 코너 전용 테이프(50mm×30m)입니다."}
 ,
   {q:"벽 흠집·갈라짐·못 자국을 튜브로 짜서 간편하게 메우고 싶어요",rec:["틈새 메꾸미","브이텍 크랙필러"],why:"틈새 메꾸미는 튜브타입으로 가정에서도 손쉽게 짜서 쓰는 수용성 충진 보수제입니다. 건물 벽면의 흠집·갈라짐·못 자국, 크랙·구멍 충진 보수에 쓰며 기초도장·면보수·데코 충진용으로 적합합니다. (20g) 보수할 곳이 넓거나 도색까지 고려하면 브이텍 크랙필러(290g)로 안내하십시오."},
   {q:"벽에 못자국이랑 금 간 데 메울 거 주세요",rec:["브이텍 크랙필러","브이텍 퍼티필러 VT-460"],why:"둘 다 수용성 보수용 충진제로 가정용 벽면·천장·문틀·창틀의 흠집, 못 자국, 크랙 충진에 쓰며 건조 후 도색이 가능합니다. 보수할 곳이 한두 군데이거나 좁은 틈이면 튜브형 크랙필러(VT-127, 290g)가 짜서 바로 채울 수 있어 편하고, 금 간 벽·석고보드 구멍·깨진 타일처럼 부위가 넓거나 여러 곳이면 통형 퍼티필러(VT-460, 500g)를 헤라로 펴 바르도록 안내하십시오. 깊은 부위는 한 번에 채우지 말고 여러 번 나누어 충진·건조해야 갈라지지 않습니다."},
   {q:"못 대신 강력하게 붙이는 만능 접착제 / 거울·몰딩·걸레받이 부착",rec:["브이텍 인테리어 전용 접착제","TYTAN FIX² GT (초강력 하이브리드 접착제)"],why:"못을 대신하는 인테리어 전용 접착제(Vital Nails)입니다. 초기 경화가 우수해 콘크리트·목재·거울·철물·타일은 물론 몰딩·걸레받이·데코타일·석고보드·판넬 등 다양한 재질을 강력하게 붙입니다. 접착면의 먼지·기름을 닦고 건조시킨 뒤 도포해 손으로 눌러 붙이고, 테이프 등으로 임시고정하면 효과가 크며 약 10분 후 강력하게 접착됩니다. 어린이 손이 닿지 않게 보관하도록 안내하십시오."},
   {q:"습윤한 면·다양한 마감재를 강력하게 붙이는 하이브리드 접착제 (거울·타일·석재·금속)",rec:["TYTAN FIX² GT (초강력 하이브리드 접착제)","HB020 다목적 강력접착제","Tec7"],why:"모두 하이브리드 접착제로 습윤한 면에도 접착되고 무용제·무이소시아네이트 친환경 제품입니다. 타이탄 FIX² GT는 반죽형 카트리지 타입으로 초기 접착력이 강해 콘크리트·나무·벽돌·유리·금속·세라믹 타일·석재·거울·장식재를 강력하게 붙이며, 표면경화 약 6분·초기접착 30분·최대 접착강도 3시간(400kg/cm²)으로 빠르게 굳습니다. PE·PP·테프론·아스팔트 및 영구 침수·상시 젖은 면에는 사용하지 않습니다. HB020(누리켐 NURI BOND)도 같은 하이브리드 폴리머 다목적 접착제로 건축자재·단열/방음재·계단 논슬립·인테리어 장식 부착에 쓰며, 표면경화 10분 이내·인장강도 26~28Kgf/cm²·경도 Shore A 60~70입니다. Tec7은 MS폴리머 실링·접착 겸용으로 실링이 함께 필요한 부위에 안내하면 좋습니다. 두 제품 모두 시공 전 피착면의 먼지·기름을 제거하고, 넓은 면은 물결 모양으로 도포해 눌러 붙입니다."},
   {q:"벽·석고보드·문짝에 뚫린 구멍이나 파손을 메우고 싶어요",rec:["브이텍 월패치","브이텍 퍼티필러 VT-460"],why:"브이텍 월패치는 파손 부위 크기에 맞게 잘라(15×15cm·2매) 물을 뿌려 붙이는 미장 메쉬 패치입니다. 벽면·가구·석고보드·문짝의 구멍·파손 보수에 쓰며, 파손부에 물을 스프레이하고 패치를 붙인 뒤 다시 스프레이해 안쪽에서 바깥으로 문질러 활성화합니다. 경화 30분까지는 누르지 말고, 큰 구멍은 조인트 테이프를 덧대며, 경화 후 브이텍 퍼티필러(VT-460)로 위를 펴 발라 마감하도록 안내하십시오."},
   {q:"마루·몰딩·가구·샤시 흠집이나 틈을 색 맞춰 메우고 싶어요 (만능 컬러 보수)",rec:["케미컬 코크 미니"],why:"다양한 곳에 쓰는 만능 컬러 보수제입니다. 목재 바닥재 흠집·틈, 실리콘 대용 틈새 마감, 데코타일·PVC 바닥재 틈, 각종 몰딩재 틈, 타카(핀) 자국, 인테리어 필름 흠집, 샤시 몰라 틈새, 목질가구·창호·액자 등 색이 드러나는 부위를 15색 중 색을 맞춰 메웁니다. 백색인 브이텍 크랙필러보다 자연스럽게 마감되고, 색이 애매하면 2색을 섞되 굳으면 조금 어두워지므로 기존 면보다 살짝 밝은 색을 권하십시오. 튜브 50g으로 부분·소면적 보수에 적합합니다."}
   ,{q:"인테리어 필름(시트지) 붙이기 전에 접착력 높이는 프라이머 있나요",rec:["시트지 프라이머 HJ-2300"],why:"PVC 필름·인테리어 필름의 접착력을 높이는 수용성 프라이머입니다. 수용성이라 화재 위험이 없고 냄새가 적으며 용제에 의한 필름 손상이 없습니다. 원액을 붓·헤라·주걱·로라로 도포하고 완전 건조(약 1시간 이상) 후 필름을 부착하도록 안내하십시오. 다만 건조가 다소 느리고 프라이머 자국이 남을 수 있어 시공이 까다로운 편이라는 점도 함께 설명하십시오. (1.8L)"}
   ,{q:"가구 엣지·목재·멜라민 시트·플라스틱 접착용 프라이머(돼지표) 찾아요",rec:["시트지 프라이머 돼지표 D-5600"],why:"인테리어 필름 희석 프라이머로, 가구류 엣지·목재, 목재와 멜라민 시트, 각종 플라스틱, 유리섬유 단열재 접착에 씁니다. 붓·스프레이 작업성이 우수하고 초기 접착력이 좋으며 다공질 피착재에도 접착 성능이 좋습니다. 건조가 약 30분으로 빨라 작업이 빠르고 덩어리 지는 현상이 덜해 초보자에게도 적합합니다. 본 취급 제품은 희석 완료 상태이며, 추가 희석이 필요하면 소부신나로 희석(규정은 톨루엔이나 미취급)하도록 안내하고, 시공 시 냄새가 나므로 환기·보호구 착용을 안내하십시오."}
 ]},
 {g:"목재 · 철재 도장 마감",items:[
   {q:"외부 목재·야외 가구에 바르는 오일스테인",rec:["본덱스 오일스테인","본덱스 데킹오일"],why:"침투성 목재 보호 도료로 둘 다 실외용입니다. 펜스·파고라·목재 외벽, 야외 테이블·벤치 같은 옥외 가구는 본덱스 오일스테인(MATT), 사람이 밟는 외부 바닥 데크는 데킹오일(무광, 레드마호가니·투명·오크)로 구분해 안내합니다. 실내 가구는 이 제품이 아니라 실내용 마감재로 안내하십시오."},
   {q:"목재에 색만 입히고 냄새는 적었으면 해요",rec:["본덱스 수용성스테인 플러스"],why:"수용성(수성) 목재 스테인. 냄새와 유해성이 적고 색상 선택이 넓어 실내 목재 도장에 적합합니다."},
   {q:"가구·계단 나무 표면 투명하게 코팅",rec:["본덱스 퀵드라잉 PU 바니쉬"],why:"수성 폴리우레탄 바니쉬로 실내 목재 마감용입니다. 내열성이 좋아 뜨거운 것이 닿아도 도막이 쉽게 무르거나 자국이 남지 않으므로, 식탁이나 조리대 상판처럼 열이 닿는 가구에 권할 수 있습니다."},
   {q:"식탁·조리대 상판에 뜨거운 걸 올려도 되는 마감재",rec:["본덱스 퀵드라잉 PU 바니쉬","엠비바니쉬"],why:"내열성이 좋은 수성 폴리우레탄 바니쉬를 안내합니다. 뜨거운 것이 닿아도 도막이 쉽게 무르거나 자국이 남지 않아 식탁·조리대 상판, 주방 가구에 적합합니다. 실내 목재 전용이며 무광·반광·유광 중 선택할 수 있고 재도장은 4시간 후입니다. 친환경 저VOC라 식탁 사용이 가능하고 내열·내수성이 좋으며 실내외 겸용인 엠비바니쉬(유광·반광·무광, 1L·3.5L)도 함께 안내할 수 있습니다."},
   {q:"물이 자주 닿는 나무 / 선박·처마 마감",rec:["본덱스 요트 바니쉬"],why:"선박용(REGATTA) 유광 바니쉬. 방수·자외선 차단 성능이 높아 물 접촉이 많은 목재, 외부 간판·목조주택 처마에 사용."},
   {q:"실내외 목재에 냄새 적고 빠르게 마르는 친환경 투명 바니쉬 (열·물·자외선에 강한 마감)",rec:["엠비바니쉬"],why:"MOKBON's 엠비바니쉬는 휘발성유기화합물(VOC)을 극소화한 친환경 목재 마감 도료(상도)입니다. 냄새가 적고 60분 이내 건조돼 작업이 빠르며, 내열성이 좋아 코팅면이 열에 노출돼도 변색·박리가 적습니다. 강한 내수성과 접착력으로 물·오염·스크럽에 강하고 비 오는 날에도 잘 벗겨지지 않으며, 자외선에 강해 황변이 적어 색이 오래 유지됩니다. 도막이 얇아도 목재 고유의 무늬·질감을 살리고 광도는 유광·반광·무광에서 고릅니다. 가구·원목마루·콘크리트·대리석 등 다양한 소재에 쓰며(도장 전 부착 테스트 권장) 실내외 겸용, 도포면적 6~9㎡/L, 1L·3.5L로 취급합니다. 스프레이건은 물을 조금 희석해 사용하도록 안내하십시오."},
   {q:"문틀·철재에 붓칠할 페인트 주세요",rec:["시르카 엔틱 에나멜 (수용성에나멜)"],why:"목재·철재 겸용 수용성 에나멜(실내외 겸용). 도어·창틀·몰딩, 펜스·벤치·철재 장식물 도장에 사용하며 수용성이라 냄새 부담이 적습니다."},
   {q:"지하실·차고 바닥에 칠하는 페인트",rec:["드라이락 콘크리트 바닥"],why:"저광택 콘크리트 바닥 도장재로 하도·상도 겸용. 미끄럼·눈부심 방지 효과가 있으며 개인 주택 차고까지 가능(공용 주차장은 불가)."},
   {q:"수성/유성 페인트 주세요",rec:[],why:"내부 벽은 수성, 철제·외부 강한 도막은 유성으로 안내합니다. 일반 수성·유성 페인트는 핸드북 미등재 품목이므로 매장 재고와 색상을 확인해 주십시오. 목재라면 본덱스(유성)·시르카 엔틱 에나멜(수용성)로 안내할 수 있습니다."}
 ,
   {q:"나무 구멍·옹이·못자국 메울 거 주세요",rec:["팀버메이트 우드필러","케미컬 코크 미니"],why:"도장·착색 예정이면 팀버메이트 우드필러로 안내합니다. 수성이라 냄새가 적고 건조 후 수축·탈락이 없으며 샌딩 후 스테인 착색과 모든 상도 도장이 가능합니다. 색을 맞춰 그대로 마감할 마루·몰딩 흠집은 케미컬 코크 미니(15색)로 구분해 안내하십시오."},
   {q:"나무 색에 맞춰 가구·마루·문 흠집을 메우고 싶어요 (튜브형·색상 선택)",rec:["브이텍 우드필러","팀버메이트 우드필러"],why:"브이텍 우드필러는 8색(화이트·내추럴·오크·잭우드·체리·브라운·마호가니·다크월넛) 중 목재 색에 맞춰 고르는 수용성 튜브형 충진제로, 문·계단 목조부·목재가구의 깨짐·홈을 메우고 2색을 섞어 조색할 수 있습니다. 표면의 먼지·기름을 닦고 채운 뒤 헤라로 고르고, 잔여물은 마른 헝겊으로 닦고 경화 후 부드럽게 연마해 마무리합니다. 도장·착색까지 할 넓은 부위나 나뭇결 메움은 팀버메이트 우드필러로 구분해 안내하십시오."},
   {q:"나뭇결(도관)을 메워서 매끈하게 칠하고 싶어요",rec:["팀버메이트 우드필러"],why:"그레인 필러 용도로 물을 섞어 치약 점도로 만든 뒤 나뭇결 수직 방향으로 얇게 밀어 도포합니다. 약 10~12㎡/1kg(MDF·파티클보드는 12~15㎡/1kg)이며, 1~2시간 건조 후 120번 이상 사포로 샌딩합니다. 합판·MDF 엣지 충진과 도장 전 하도(샌딩 실러)로도 같은 제품을 씁니다."},
   {q:"실내 목재에 바르는 수성 바니시 (삼화)",rec:["아이생각 수성우드바니시","수성크리어PLUS 무광","수성크리어PLUS 유광"],why:"삼화 수성 목재 마감재입니다. 목재 전용은 수성우드바니시, 도장면 위 투명 보호 코팅은 수성크리어PLUS로 안내하며 광택(무광/유광)은 원하는 마감에 맞춰 고릅니다."},
   {q:"실내외 목재(데크·펜스·가구)에 색 입히고 보호하는 수성 스테인",rec:["엠비 수성스테인","본덱스 수용성스테인 플러스"],why:"엠비 수성스테인은 목재에 침투해 보호·방부하고 자연스러운 색을 살려주는 친환경 아크릴 에멀젼 수성 스테인입니다. 물·햇빛에 강해 실내외 겸용이고 냄새가 적으며 60분 내 빠르게 건조돼 다음날 비에도 안심입니다. 24색(투명~원색)에 조색이 가능하고 도포면적 9~12㎡/L, 1L·3.5L·16L로 취급합니다. 충분히 건조된 목재에 얇게 여러 번 도장하고, 색을 연하게 하려면 투명색과 섞도록 안내하십시오. 유럽산(덴마크) 스테인을 원하면 본덱스로 구분해 안내합니다."},
   {q:"철문·난간에 칠할 유성 페인트 (삼화)",rec:["777에나멜","락카"],why:"철재용 유성 도료입니다. 붓·로라 도장은 777에나멜, 스프레이로 빠르게 마감하거나 소품 도장은 락카로 안내합니다. 냄새가 강하므로 환기와 마스크를 함께 권하십시오."},
   {q:"타일 위에 페인트 칠할 수 있나요",rec:["홈스타 타일페인트","매직탄"],why:"타일 표면은 비흡수면이라 전용 제품이 필요합니다. 욕실·주방 타일 도장은 홈스타 타일페인트, 넓은 면이나 다목적 코팅은 매직탄 계열로 안내합니다. 물이 상시 고이는 바닥 타일은 내구성 한계를 미리 설명하십시오."},
   {q:"공장·주차장 바닥 에폭시 주세요",rec:["에포코트 하도","에포코트 상도","슈퍼에폭씰"],why:"삼화 에폭시 바닥재입니다. 하도(프라이머) → 상도 순으로 시공하며, 냄새·용제가 부담되는 실내는 수용성인 에포코트아쿠아 하도·상도로 안내합니다. 콘크리트 표면 강화·씰링이 목적이면 슈퍼에폭씰입니다."},
   {q:"바닥에 투명하게 코팅만 하고 싶어요",rec:["A플로어투명"],why:"바닥 색을 덮지 않고 보호 코팅만 하는 제품입니다. 노출 콘크리트나 기존 바닥 위 먼지 방지·광택 마감에 안내합니다."},
   {q:"주차장 차선이나 노면 표시 도료 있나요",rec:["KSM6080 1종 상온건조형 노면표지용도료"],why:"KS M 6080 1종 상온건조형 노면표지용 도료입니다. 주차장 라인, 도로 노면 표시에 사용하며 시공 전 바닥 유분·먼지 제거가 필요하다고 안내하십시오."},
   {q:"원목가구 칠하려는데 밑작업이랑 마감재까지 주세요",rec:["실카 엔틱 샌딩 실러","실카 엔틱 바니쉬 PRO"],why:"수용성 목재 도장 세트입니다. 도장 전 샌딩 실러로 하도(소프트 우드의 색 얼룩 방지), 마감은 투명 아크릴 바니쉬 PRO로 상도합니다. 엔틱 스테인 도장 후 마감재로도 사용합니다."},
   {q:"아기 있는 집이라 친환경으로 칠하고 싶어요",rec:["비오파 컬러 오일 피니쉬","비오파 다용도 마감오일 2044K"],why:"독일 비오파 천연 오일 계열입니다. 컬러 마감은 컬러 오일 피니쉬(실내외 겸용, 마루·가구·장난감), 투명 반광 마감은 다용도 마감오일 2044K(원목마루·가구·문틀·몰딩)로 안내합니다."},
   {q:"도마나 식탁 상판에 발라도 되는 오일 있나요",rec:["비오파 워크탑 오일 2052"],why:"무용제 제품으로 원목 주방가구 상판, 플레이팅 도마, 샐러드 보울, 어린이 가구·장난감처럼 식품·피부에 닿는 목재에 사용합니다. 하도·상도·유지 관리까지 한 제품으로 가능합니다."},
   {q:"마루나 가구에 왁스 먹이려는데요",rec:["비오파 향기 왁스 2060","비오파 다용도 하도오일 3754K"],why:"실내 목재용 고체왁스로 마루바닥·가구·내장재와 코르크, 리놀륨 마감에 사용합니다. 흡수성이 강하거나 고르지 않은 목재·코르크·석재는 다용도 하도오일 3754K로 먼저 하도하면 마감이 균일해집니다."},
   {q:"유성 붓이랑 로라 씻을 거 주세요",rec:["비오파 오렌지향 신너"],why:"비오파 오일 제품 희석 및 유성 도료·오일 도장도구 세척용입니다. 기름 오염 세척, 접착제·스티커 자국 제거에도 사용합니다. 수용성 도료 도장 전 표면 세척용으로는 사용할 수 없습니다."}
 ]},
 {g:"미장 · 부자재 · 도구",items:[
   {q:"미장할 때 크랙·백화 방지 혼화제",rec:["메도미","메도로스"],why:"시멘트에 섞는 보수성 혼화제. 메칠셀룰로오스계 메도미가 방수·백화방지, 메도로스는 보수·접착."},
   {q:"견출(미다시) 작업에 섞을 것 주세요",rec:["메도미"],why:"견출 및 미장공사, 벽돌 조적몰탈·펌프압송몰탈, 타일공사에 사용합니다. 견출 작업이면 메도로스가 아니라 메도미로 안내하십시오."},
   {q:"조적·타일 몰탈에 섞는 혼화제",rec:["메도로스"],why:"초벌 및 정벌 미장공사, 타일공사, 조적공사, 시멘트 2차 제품에 사용하는 보수·접착용 혼화제입니다."},
   {q:"페인트 뿌릴 장비 있나요",rec:["무선충전스프레이건","그레이코 390 PC 소형 전기식 도장기"],why:"소규모·이동 작업은 충전식 무선 스프레이건(오키토 KSG-77M), 주택·상가 내외부처럼 면적이 크고 전문 도장이면 그레이코 390 PC 전기식 에어리스로 안내합니다. 에어리스는 전원이 필요하지만 도료를 희석 없이 고압 분사해 작업 속도와 마감 품질이 다릅니다."},
   {q:"에어리스 팁이 막혔어요 / 팁 교환하려고요",rec:["그레이코 RAC X 스위치 팁"],why:"RAC X 스위치 팁은 막혔을 때 팁을 180° 돌려 역분사하면 뚫리는 회전식입니다. 팁 번호는 앞자리×2가 분사 폭(인치), 뒷 두 자리가 오리피스 크기(1/1000인치)이므로 도료 점도와 도장 면적을 물어보고 번호를 안내하십시오(예: 517 = 분사 폭 약 10인치·0.017″). 4,000psi 이하에서 사용합니다."},
   {q:"팁 가드(노즐 가드)만 따로 주세요",rec:["그레이코 에어리스 팁 가드 RAC X (246215)","그레이코 에어리스 팁 가드 RAC 5 (243161)"],why:"쓰던 팁 종류를 먼저 확인하십시오. RAC X 스위치 팁(LTXxxx)은 청색 246215, RAC 5 스위치 팁(286xxx)은 주황색 243161입니다. 둘 다 나사산 7/8인치(22mm)·최대 4,050psi이며 공구 없이 손으로 체결합니다."},
   {q:"도장기 펌프 오일 있나요",rec:["그레이코 에어리스 펌프오일 TSL"],why:"그레이코 펌프 스로트 패킹 윤활유입니다. 도장 전 스로트 패킹 너트를 TSL로 채우면 페인트가 굳지 않고 패킹 마모가 줄어듭니다. 매일 또는 스프레이 작업 때마다 보충하도록 안내하고, 용량은 118㎖·236㎖·950㎖ 중 사용량에 맞춰 권합니다. 마감 색상에는 영향을 주지 않습니다."},
   {q:"실리콘·페인트·스티커·낙서·그을음 자국을 친환경적으로 제거하고 싶어요",rec:["Tec7 리무브 올","페인트 가스켓 제거제 YECOA YL-601D"],why:"Tec7 리무브 올은 100% 물에 용해되고 접촉 시 인체에 무해한 친환경 다목적 제거제입니다. 경화된 실리콘·페인트·락카·접착제·우레탄폼·스티커·테이프 잔사·잉크·그을음 제거에 쓰며, 바른 뒤 30분~1시간 후 헤라·천으로 문지르고 작업 후 깨끗한 물로 철저히 헹구도록 안내하십시오. 단 순수한 실리콘과 매우 오래되고 두꺼운 페인트 층에는 효과가 거의 없습니다. 금속 가스켓·금형 사출 탄화물 등 공업용 박리는 YECOA YL-601D로 안내합니다."},
   {q:"페인트·가스켓·접착제 자국을 녹여서 제거하고 싶어요",rec:["페인트 가스켓 제거제 YECOA YL-601D"],why:"YECOA YL-601D는 강력한 침투·용해력으로 페인트·가스켓·접착제 자국을 박리하는 전문가용 제거제입니다. 에나멜·락카·에폭시·우레탄·아크릴 도막과 가스켓·씰링제, 금형 사출 탄화물, 열에 고착된 유분·카본 잔유물 제거에 쓰며, 모든 금속에 안전하고 발암성 물질이 없는 저자극성입니다. 자동차 도장 제거에도 사용합니다."},
   {q:"파이프·공구·농기구가 부러졌는데 감아서 단단히 수리하고 싶어요",rec:["브이텍 밴드앤픽스"],why:"물로 굳히는 수경화성 강력 보수 테이프입니다. 유리섬유와 폴리우레탄 소재로 가정용품·공구·아웃도어·농기구·가정/산업용 배관의 수리·접합·연결에 씁니다. 보수 부위의 기름·먼지를 제거하고, 동봉 장갑을 끼고 테이프를 물에 2~3초 담가 짜서 당기며 감은 뒤 주물러 물과 거품을 빼줍니다. 감은 후 2~3분부터 경화가 시작돼 약 20분이면 단단히 굳는다고 안내하십시오. (5cm×3.6M)"},
   {q:"두꺼운 전문가용 실리콘 테이프 / 고온·누수 부위를 감아 밀봉하고 싶어요",rec:["브이텍 VT-700 실리콘 테이프 (전문가용)","브이텍 실리콘테이프"],why:"VT-700은 일반 실리콘 테이프보다 두께가 두꺼운 전문 시공용 자가융착 실리콘 테이프입니다. 접착제 없이 겹쳐 감으면 자체 융착되고 방수·전기절연 기능이 있으며 -65~260℃, 연료·산·솔벤트·소금물·UV에도 강합니다. 새는 파이프·호스, 라디에이터, 전기선 절연, 도구·핸들 미끄럼 방지 등에 쓰며, 절반 이상 겹치도록 당기며 감고(최대 200% 신장) 더 강하게 붙이려면 3번 이상 겹쳐 감도록 안내하십시오. 얇은 일반용이면 브이텍 실리콘테이프(VT-067)로 안내합니다. 화이트·레드·블랙 3색, 25mm×3M."},
   {q:"끈적임 없이 감아 밀봉하는 자가융착 테이프 / 전기절연·누수 임시 수리",rec:["브이텍 실리콘테이프"],why:"접착제 없이 자체 융착되는 실리콘 테이프입니다. 물기·경미한 오일이 있는 표면에서도 작업되고 방수·전기절연 기능이 있으며 -65~260℃, 연료·산·솔벤트·UV에도 강합니다. 새는 파이프·호스, 전기선 절연, 도구·핸들 미끄럼 방지, 부식 방지 등에 쓰며, 절반 이상 겹치도록 당기며 감고(최대 200% 신장) 더 강하게 붙이려면 3번 이상 겹쳐 감도록 안내하십시오. 화이트·레드·블랙 3색, 2.5cm×3M."},
   {q:"철·타일·파이프 구멍이나 크랙을 반죽해 메워 붙이는 에폭시 퍼티 있나요",rec:["브이텍 파워픽스 다용도 에폭시 퍼티","브이텍 파워픽스 스틸전용 에폭시 퍼티"],why:"두 가지를 균일한 색이 되게 반죽해 3~5분 내 붙이는 2액형 에폭시 퍼티(믹스&픽스)입니다. 고강도 접착력(150 Kg/㎠)·난연성이며 경화 후 드릴·탭핑·연마·페인팅이 됩니다. 다용도(VT-139)는 수중 접착이 가능해 파이프·물수조·풀장·욕조 크랙, 떨어진 타일 부착, 목재·플라스틱 구멍 메꿈에, 스틸전용(VT-138)은 라디에이터·스틸 파이프 등 철재 보수에 안내하십시오. 장갑을 끼고 반죽해 구멍에 우겨넣고 새어나온 부위는 젖은 헝겊으로 닦습니다."},
   {q:"보양·마스킹 자재 주세요",rec:[],why:"도장 경계는 마스킹테이프, 넓은 면 보양은 카바링테이프로 안내합니다. 두 품목 모두 핸드북 미등재이므로 매장 재고와 규격(폭)을 확인해 주십시오."}
 
   ,{q:"대리석·테라죠·아스타일 바닥에 광택(왁스) 내는 제품 있어요",rec:["갤럭시 왁스 (석재용 바닥 광택제)"],why:"대리석·화강석·아스타일 등 석재 전용 바닥 광택 수지 왁스입니다. 세제로 묵은 왁스·찌든때를 세척하고 완전 건조 후 원액을 골고루 도포하며, 건조되면 1~2회 더 도포하도록 안내하십시오. 신개발 폴리머로 고광택·내구성이 좋고 접착력이 뛰어나 대리석 바닥 코팅제로도 적합합니다. 일상 청소는 갤럭시크리너 1:물 30 희석. 용도 외 사용·타 제품 혼합 금지, 보호구 착용 안내. (18.75L·3.75L)"}
   ,{q:"스테인리스·구리 금속 찌든때·녹물 제거하고 광 내는 제품 있어요",rec:["FREE 금속광택제 (금속 광택 크리너)"],why:"스테인리스·구리·니켈 등 금속의 찌든때·녹물을 쉽게 제거해 본래 광택을 되살리는 수성 금속 광택 크리너입니다. 표면 보호 성분이 있어 작업 후 광택이 오래 갑니다. 잘 흔든 뒤 헝겊에 묻혀 오염부를 문질러 닦고, 제거 후 깨끗한 헝겊·융으로 마무리하도록 안내하십시오. 표준 사용량 20g/㎡. 남은 액을 원액과 섞지 말고 얼지 않게 보관. (취급 3.75L)"}
 
   ,{q:"바닥 왁스·광택 코팅 전에 바르는 기초 피막제(하도) 있어요",rec:["베이스씰 BASE SEAL (기초 피막제)"],why:"아스타일·대리석·테라죠·도끼다시 등 각종 화학상재와 화강석·콘크리트·비닐타일에 기초 피막을 형성하는 하도 피막제입니다. 석재 등 하드 플로어에 접착력·실링 효과가 우수하고 어떤 광택제와도 함께 쓸 수 있어 왁스·광택 코팅 전 밑작업으로 적합합니다. 박리제로 묵은 왁스 제거→2회 이상 수세→완전 건조 후 도포하고, 1차 도포 후 30~40분 건조하며 고광택은 2~3회 재코팅하도록 안내하십시오. 건조가 부족하면 광택이 사라질 수 있으니 충분히 건조가 관건입니다. (취급 3.75L)"}
 
   ,{q:"UV코팅 된 바닥재 관리·피막 코팅하는 제품 있어요",rec:["UV 베이스 UV BASE (UV코팅 바닥 밀착 피막제)"],why:"UV코팅된 바닥재 전용 밀착강화형 피막제입니다. 밀착강화형 아크릴·우레탄 폴리머로 UV코팅 바닥에 밀착성이 뛰어나 피막 들뜸을 방지하고, 유연하고 강인한 피막을 형성해 내마모성이 좋습니다. 내수성·내화학성도 우수해 유지관리가 쉽습니다. UV코팅 바닥 전용이니 용도에 맞게 안내하십시오. (캉가루, 3.75L)"}
 
   ,{q:"공장 바닥·기계·부품에 붙은 기름때(그리스) 지우는 강력 세정제 있어요",rec:["프로크리너-1000 (다목적 세정제)"],why:"자동차 엔진 기름때, 각종 기계류·부품·공구, 공장 바닥의 기계기름·그리스를 분해 제거하는 수성타입 강력 크리너입니다. 특수 계면활성제 배합으로 세정력이 강하고 화재 위험이 없으며 용도에 따라 희석해 씁니다. 알루미늄 휠 등은 물 10배 이상 희석, 도장면·유리·특수 도금휠에는 사용 금지, 전기계통은 덮개 후 작업하도록 안내하십시오. 가정용이 아닌 전문가용입니다. (18L)"}
 
   ,{q:"PVC·비닐타일 바닥에 광택 내고 통행 많은 곳 바닥 관리하는 광택제 있어요",rec:["에이스코트 ACE COAT (바닥 광택제)"],why:"특수 폴리머 배합의 최고급 고성능 바닥 광택제입니다. 선명한 고광택과 우수한 광택 지속성을 지니며 구두 하이힐 등에 의한 블랙 힐 마크가 잘 생기지 않아 통행량 많은 장소·고급 바닥 관리에 적합합니다. 도포가 쉽고 퍼짐성이 좋으며 건조가 빨라 작업시간이, 박리도 쉬워 박리시간이 단축됩니다. 바닥재에 따라 밀착성이 다르니 눈에 띄지 않는 곳에 소량 시험 후 사용하도록 안내하고, 전문가용으로만 판매하십시오. (18.75L)"}
 
   ,{q:"바닥에 묵은 왁스·광택제 피막 벗겨내는 박리제 있어요",rec:["파워스트립 Power strip (바닥 박리제)"],why:"모든 광택제 피막에 강력하게 침투해 쉽게 용해시키는 강력 바닥 박리제입니다. 침투·용해성이 강하고 빠른 분해로 박리작업 시간을 단축하며, 특히 PVC타일에는 영향을 주지 않습니다. 왁스·광택 재코팅(베이스씰·에이스코트·갤럭시 왁스) 전 묵은 피막 제거 단계에 안내하십시오. 가정용이 아닌 전문가용입니다. (18.75L)"}
 
   ,{q:"건물 바닥 일상 청소(세정)하는 순한 중성 세정제 있어요",rec:["에이스크리너 ACE CLEANER (바닥 일상 세정제)"],why:"바닥에 묻은 흙·먼지·때를 쉽게 제거하는 중성세제 타입 일상관리 세정제입니다. 바닥재에 영향이 적은 중성이라 UHS 시스템 바닥관리와 석재 바닥관리에 적합하고, 잔류성분이 적어 2차 오염이 적으며 저자극성입니다. 강한 기름때·박리가 아닌 일상 청소용으로 안내하고(기름때는 프로크리너, 폴리싱타일은 엑스트라 크린), 작업 후 손·발을 깨끗이 씻도록 안내하십시오. (18.75L)"}
 
   ,{q:"신주(놋쇠)·금속 찌든때·녹물 닦고 광 내는 세제 있어요",rec:["썬룩스 (신주크리너)"],why:"금속류의 찌든때·녹물·오염을 제거해 광택을 유지시키는 위생적·환경 친화적 세제로, 특히 신주(놋쇠·황동) 세척·광택에 씁니다. 물 10배로 희석한 뒤 규조토 가루(종이컵 2~3개 분량)를 넣어 막걸리처럼 혼탁해지면 운동화솔(PVC솔)로 신주에 묻혀 4~5회 문지르고, 극세사 마른걸레로 닦아내면 광택이 유지된다고 안내하십시오. 규조토 잔량은 버리지 말고 희석액만 보충해 재사용합니다. (넓은 면 금속 광택은 FREE 금속광택제로 안내)"}
 
   ,{q:"옥상·현장에서 분진·물 빨아들이는 건습식 산업용 청소기 있어요",rec:["사이클론 배코 CH-400 AUTO (건·습식 산업용 청소기)"],why:"건식·습식 겸용 사이클론 산업용 청소기입니다. 이동이 간편해 옥상 작업에 매우 적합하고, 분진을 비닐에 담아 그대로 버릴 수 있어 처리가 편리합니다. 50L 대용량 탱크와 2700W(3.5HP) 모터로 강력 흡입하며, 풍압 2600mmAQ·소음 65db·중량 54kg입니다. 220V(50/60Hz) 전원으로 사용하도록 안내하십시오."}
 
   ,{q:"콘크리트 갈기(연삭·그라인더) 미세분진까지 잡는 HEPA 집진기 있어요",rec:["사이클론 배코 CH-250 AUTO (건·습식 집진기)"],why:"이동이 편리한 사이클론 건·습식 미니 집진기입니다. PTFE HEPA 필터로 0.3µ 미세먼지·분진을 완벽 포집하고, 신개념 자동 필터 털이(특허)로 24시간 연속 사용이 가능해 콘크리트 면처리(연삭·그라인더·잔해 분진 청소)와 목공·인테리어 작업에 적합합니다. 출력 2700W(3.5HP)·포집력 4050W(5.3HP)·풍압 2600mmAQ·탱크 40L, 보조탱크 45L. 220V(50/60Hz) 전원. 더 큰 용량이 필요하면 CH-400 AUTO(50L)로 안내하십시오. (중량은 CH-250A 46kg/CH-250S 30kg, 취급 사양 확인)"}, {q:"창고·사무실·식당·세차장에서 쓸 대형 75L 산업용 진공청소기(건식/건습식) 있어요",rec:["경서글로텍 KV-103 (건식 KV-103D · 건습식 KV-103W)"],why:"경서 글로텍의 대형 산업용 진공청소기입니다. 스테인리스 75L 대용량 탱크에 220V·진공도 2600mmH₂O로 강력 흡입하며, 호스 4m·전선 13m로 멀티탭 없이 넓은 공간을 청소할 수 있습니다. 건식 전용이 필요하면 KV-103D(2700W/3.6HP, 27kg), 물기와 먼지를 함께 잡아야 하면 건식·습식 겸용 KV-103W(2400W/3.2HP, 28kg)로 안내하십시오. KV-103W는 회전형 탱크로 분진·액체를 쉽게 비우고, 볼탑으로 물이 차면 자동 흡입 중단, 국산 듀얼 모터와 우레탄 바퀴를 갖췄습니다. Made in Korea."},{q:"입문·가정용 AVA 전동 고압세척기(140Bar) 있어요",rec:["AVA GO P55 (140Bar 고압세척기)"],why:"노르웨이 브랜드 AVA의 GO 라인 전동 고압세척기입니다. 최대 140Bar로 차량·외벽·바닥 등을 세척하며, 세부 사양·구성은 상세 이미지를 참고하십시오. 더 높은 압력·토출량이 필요하면 Easy P57(145Bar)·Evolution P90(160Bar)·Master P80(180Bar 자흡식)으로 안내하십시오. 권장 연속 사용은 30분 사용/10분 휴식."}, {q:"차량·외벽·바닥을 강력하게 세척할 고압세척기(전동) 있어요",rec:["AVA Easy P57 (145Bar 고압세척기)"],why:"노르웨이 브랜드 AVA의 전동 고압세척기입니다. 145Bar 압력·450L/h(7.4L/min) 토출량에 2100W 카본 모터와 V3 펌프를 탑재해 개인주택 세차부터 전문 청소까지 대응합니다. 접이식 핸들로 보관이 간편하고 12m 플렉시블 호스, 손에 힘이 거의 들지 않는 PG3 제로 포스 고압건, 64→96cm 줌랜스, 폼캐논(600mL)이 기본 제공됩니다. 3in1 가변(20°/60°/콤비)·회오리 노즐을 제공하며, 옵션으로 텔레스코픽 랜스(최대 4m)·플렉스 랜스·사각 브러시를 선택할 수 있습니다. 권장 연속 사용은 30분 사용/10분 휴식."},{q:"산업 현장·전문 청소용 고압력(160Bar) 대형 고압세척기 있어요",rec:["AVA Evolution P90 (160Bar 고압세척기)"],why:"노르웨이 브랜드 AVA의 산업·전문가용 전동 고압세척기입니다. 160Bar 압력·730L/h(12L/min) 토출량에 3300W 인덕션 모터와 V6 펌프를 탑재해 장시간 강력하고 안정적으로 사용할 수 있습니다. 15m 기본 고압 호스(10m 단위 연장 가능)와 최대 20m를 수용하는 스위블 릴, 전선 정리 장치, PG4 제로 포스 고압건, 64→96cm 줌랜스, 폼캐논(600mL)이 기본 제공됩니다. 노즐은 0°·15°·3in1 가변(20°/60°/콤비)·회오리 4종이며, 옵션으로 텔레스코픽 랜스(최대 4m)·플렉스 랜스·사각 브러시·파티오 클리너 브러시를 선택할 수 있습니다. 무게 25.9kg. 더 가벼운 개인주택용은 Easy P57(145Bar)로 안내하십시오. 권장 연속 사용은 30분 사용/10분 휴식."},{q:"물통·수조 물을 끌어쓰는 자흡식 고압세척기, 워터파크·목욕탕·빌딩 청소용 있어요",rec:["AVA Master P80 (180Bar 자흡식 고압세척기)"],why:"노르웨이 브랜드 AVA의 자흡식 전동 고압세척기로 2019 Red Dot 디자인 어워드 수상 모델입니다. 최대 180Bar·시간당 600L(10L/min)의 동급 최대급 분사량으로 제조사 표현상 체감 200Bar급 세척력을 제공합니다. 인덕션/콘덴서 모터로 장시간 사용에 강하고, 자흡 기능으로 수도 직결뿐 아니라 물통·수조의 물을 끌어올려 사용할 수 있으며 자동 정지 기능이 있습니다. 릴 호스가 좌/우 90° 회전하고 안전바로 넘어짐을 방지하며, 황동 흡입필터·거름망 편사호스로 이물질을 걸러냅니다. 0°·15°·가변·회오리(터보) 노즐, 약 30~130cm 줌랜스, 제로포스 고압건, 폼캐논이 기본 제공됩니다. 무게 25kg. 참고로 본체 외 악세서리는 소모품으로 무상 A/S 대상이 아니며 수령 후 1~2주 내 초기 불량 확인이 필요합니다. 권장 연속 사용은 30분 사용/10분 휴식."}, {q:"호스릴·세제통 갖춘 130Bar 유선 고압세척기(가정·입문용) 있어요",rec:["DEWALT DEPW001M (130Bar 유선 고압세척기)"],why:"DEWALT 디월트의 유선 고압세척기입니다. 최대 130Bar·최대 6L/min 분사로 콘크리트·아스팔트·유리창·차량 등 다양한 표면을 세척합니다. 강한 내구성의 인덕션 모터와 알루미늄 펌프를 적용했고, 트리거를 놓으면 자동으로 분사가 멈추는 침수장치, 세제통 탈부착 세제 분사 기능을 갖췄습니다. 높낮이 조절 손잡이, 릴 회전으로 길이가 조절되는 고압 호스릴(최대 10m), 회전형 전원 스위치, 호스 퀵 커넥팅으로 사용이 편리합니다. 기본 구성은 본체·고압건·연장 랜스·세제통·정화 필터·터보(회전) 노즐·제트 노즐·호스 커넥터 3개이며, 수도 호스는 별도 구매입니다. 전력 1800W·2800RPM·무게 15.9kg·220V(60Hz). 더 높은 압력·토출량이 필요하면 AVA Evolution P90(160Bar)·Master P80(180Bar 자흡식)로 안내하십시오."}, {q:"업소·현장에서 쓸 소형(20L) 건습식 업소용 청소기 있어요",rec:["경서글로텍 SC-20W (건·습식 업소용 청소기)"],why:"경서 글로텍 SC-20W 업소용 진공청소기입니다. 스테인리스 20L 탱크에 1140W(1.6HP)·진공도 2300mmH₂O로 건식·습식 모두 청소할 수 있고, 중량 8.7kg으로 가볍습니다. 호스 2.5m·전선 9m로 이동이 편하며 고품질 우레탄 바퀴로 소음이 적습니다. 창고·사무실·식당·세차장에 적합하고, 더 큰 대용량이 필요하면 KV-103(75L)으로 안내하십시오. Made in Korea."}, {q:"그라인더(연삭·절단) 분진을 전동공구와 연동해 집진하는 소형 집진기 있어요",rec:["경서글로텍 SC-20G (그라인더 집진형)"],why:"경서 글로텍 SC-20G 그라인더 집진형(소형)입니다. 본체 콘센트(12A 미만)와 자동/중립/수동 다이얼로 4인치 이하 그라인더 등 전동공구와 연동해 연삭·절단 분진을 바로 집진합니다(자동: 공구+청소기 동시 작동). 220V·1200W(1.6HP)·진공도 2300mmH₂O, 스테인리스 20L, 9.5kg. 건·습식 겸용이며 카트리지·헤파필터를 지원합니다. 전동공구·집진카바는 별매입니다."}, {q:"흡입도 하고 배출구로 바람 불어내는(송풍) 겸용 청소기 있어요",rec:["경서글로텍 SC-12B (흡입·송풍 겸용)"],why:"경서 글로텍 SC-12B 흡입·송풍(흡배출) 겸용 건식 청소기입니다. 헤드를 분리하면 핸드형 송풍기로 쓸 수 있고, 배출구에 분산소켓을 끼우면 배출 공기로 청소기가 밀리는 것을 막을 수 있습니다. 1차 부직필터+2차 카트리지필터 2층 구조로 재비산이 적습니다. 220V·1350W(1.8HP)·진공도 2400mmH₂O, 스테인리스 42L, 11.95kg. 건식 전용입니다."},
 {q:"소형·경량 건식 업소용 청소기(13L) 필요해요",rec:["경서글로텍 KV-2S (건식 업소용 청소기)"],why:"경서 글로텍 KV-2S '국민 청소기'입니다. 스테인리스 13L·1140W(1.6HP)·진공도 2300mmH₂O로 강한 흡입력을 내면서 7.5kg으로 가볍고, 마스크 원단급 고품질 포집백과 우레탄 바퀴를 씁니다. 호스 2.5m·전선 9m로 멀티탭 없이 넓은 곳을 청소할 수 있는 건식 전용 소형 모델입니다. 창고·사무실·식당·세차장에 적합하며, 더 큰 용량이 필요하면 SC-20W(20L)나 KV-103(75L)으로 안내하십시오. Made in Korea."},
 {q:"소형·경량 건식 업소용 청소기인데 포집백 없이 쓰는 모델 있어요",rec:["경서글로텍 KV-2F (건식 업소용 청소기)"],why:"경서 글로텍 KV-2F '국민 청소기'입니다. HDPE/UV 본체 15L·1140W(1.6HP)·진공도 2300mmH₂O에 6.5kg으로 가볍고, 우레탄 바퀴와 긴 호스(2.5m)·전선(9m)을 갖춘 건식 전용 모델입니다. 스테인리스 본체·포집백 사용 모델을 원하면 KV-2S(13L)로 안내하고, KV-2F는 1차필터(포집백)를 사용하지 못하는 모델이므로 구매 전 포집백 사용 여부를 꼭 확인하십시오. Made in Korea."},
 {q:"창고·사무실 등 넓은 곳 쓸 대용량(30L) 건식 업소용 청소기 있어요",rec:["경서글로텍 KV-5S (건식 업소용 청소기)","경서글로텍 KV-5F (건식 업소용 청소기)"],why:"경서 글로텍 30L 대용량 건식 '국민 청소기'입니다. 둘 다 1350W(1.8HP)·진공도 2300mmH₂O·30L에 마스크 원단급 포집백과 우레탄 바퀴, 긴 호스(2.5m)·전선(9m)을 갖췄습니다. 튼튼한 스테인리스 본체(11kg)에 카트리지필터·헤파필터까지 쓰려면 KV-5S, 더 가벼운(9kg) HDPE/UV 본체를 원하면 KV-5F로 안내하십시오. 더 작은 용량은 KV-2S(13L)·KV-2F(15L)로, 더 큰 75L는 KV-103으로 안내합니다. Made in Korea."},
 {q:"창고·공장처럼 분진 많고 넓은 곳에 쓸 초대용량(50L)·강력 2모터 건식 청소기 있어요",rec:["경서글로텍 KV-15SB (건식 업소용 청소기)"],why:"경서 글로텍 KV-15SB는 국산 고출력 2모터(합계 2700W·3.3HP)를 탑재한 건식 업소용 국민 청소기로, 진공도 2600mmH₂O·스테인리스 50L 대용량입니다. 두 모터를 함께 쓰면 강한 흡입, 번갈아 개별 작동하면 모터 부담을 줄여 장시간 사용에 유리합니다(흡입차단장치로 진공압 손실 방지). 마스크 원단급 고품질 포집백과 저소음 우레탄 바퀴를 적용해 창고·사무실·식당·세차장 등 분진이 많고 넓은 현장에 적합합니다. 규격 78×50×45cm·16.45kg·호스 2.5m·전선 10m. 더 작은 현장은 KV-5S/5F(30L)나 KV-2S(13L)를, 위생·저소음이 중요하면 헤파필터 SALLY-2를 함께 안내하세요."},
   {q:"카페·사무실 같은 작은 곳에 둘 아주 작은 초소형 청소기 있어요",rec:["경서글로텍 KV-1SC (초소형 건식 업소용 청소기)"],why:"경서 글로텍 KV-1SC 초소형 '국민 청소기'입니다. 20L 정수기 생수통과 비슷한 사이즈(28×28×44cm)에 5L·1140W(1.6HP)·진공도 2300mmH₂O로 작지만 강한 흡입력을 내며 5.4kg으로 가볍습니다. 스테인리스 본체·우레탄 바퀴, 호스 2.5m·전선 7m를 갖춘 건식 전용 초소형 모델이라 카페·호텔·사무실·세차장·학교에 적합합니다. 다만 1차필터(포집백)를 사용하지 못하는 모델이므로 구매 전 확인하고, 더 큰 용량은 KV-2S(13L)·KV-5S(30L) 등으로 안내하십시오. Made in Korea."},
 {q:"어린이집·병원·호텔처럼 위생·저소음이 중요한 곳에 쓸 헤파필터 건식 청소기 있어요",rec:["경서글로텍 신형 SALLY-2 (건식 업소용 청소기)"],why:"경서 글로텍 신형 SALLY-2(샐리2)입니다. 헤파필터를 장착해 배출 공기가 위로 향하여 바닥 먼지를 비산시키지 않아 어린이집·병원·호텔 등 고수준의 위생을 요하는 환경에 적합하고, 모터 역설계로 소음을 분산시킨 저소음 건식 청소기입니다. 15L 스테인리스 탱크·1200W(1.6HP)·진공도 2300mmH₂O에 7kg으로 비교적 가볍고, 방수방진 IPX4·과열방지 센서·원터치 전원·회전형 앞바퀴·인체공학 손잡이·길이 조절형 파이프를 갖췄습니다. 호스 2.5m·전선 9m이며, 호스·체결부가 분리되어 파손 시 해당 부품만 교체할 수 있습니다. 헤파 여과가 특별히 필요 없는 일반 건식은 KV-2S(13L)·KV-5S(30L) 등으로 안내하십시오."},

 {g:"안전 · 보호구",items:[
   {q:"페인트·시너 냄새 막을 마스크 주세요",rec:["3M 방독마스크 6200","3M 방독마스크 7502","GVS 일립스 방독마스크 SPR503"],why:"유기용제용 방독마스크. 3M은 6200(양구형)·7502(실리콘 양구형), GVS는 정화통 일체형 SPR503(A1P3)으로 저농도 유기화합물과 분진을 함께 잡습니다."},
   {q:"가스 냄새가 독한 작업이에요 (황화수소·아황산 등)",rec:["GVS 일립스 방독마스크 SPR581"],why:"ABE1P3 등급 직결식 반면형. 유기화합물·할로겐·황화수소·시안화수소·아황산가스와 분진까지 대응합니다. 전용 정화통은 SPR582이며 SPR341과는 호환되지 않습니다."},
   {q:"눈까지 보호되는 마스크 없나요",rec:["GVS 일립스 방독마스크 SPR401","GVS 일립스 방독마스크 SPR584","3M 방독마스크 6800"],why:"고글 일체형·전면형. 도장·분무는 A1P3 SPR401, 유해가스가 강하면 ABE1P3 SPR584, 3M 계열을 쓰던 고객은 전면형 6800으로 안내."},
   {q:"먼지 많은 작업인데 방진마스크 주세요",rec:["3M 방진마스크 FF-402","GVS 일립스 방진마스크 SPR456"],why:"간편한 안면부여과식(특급)은 FF-402, 필터 교환식으로 오래 쓰려면 P100 특급·탈취 필터의 SPR456(전용 필터 SPR450)."},
   {q:"연마·절단·해체라 먼지도 많고 눈도 튀어요",rec:["GVS 일립스 방진마스크 SPR405"],why:"P100 특급·탈취 고글 일체형. 분진이 많고 눈 보호가 함께 필요한 연마·절단·해체 작업용이며 필터는 SPR450을 사용합니다."},
   {q:"필터교환식 반면 마스크 (3M 단구형)",rec:["3M 방독마스크 3200"],why:"단구형 반면형 면체. 1700-계열 필터홀더나 3000-계열 정화통을 결합해 사용하며, 6000-계열 2091K·2097K 필터와는 결합되지 않으므로 P100 분진이 필요하면 6000-계열로 안내합니다."},
   {q:"작업복·방진복도 있나요",rec:[],why:"분진·도장 작업 시 의복 오염과 노출을 줄이는 일회용 방진복으로 안내합니다. 핸드북 미등재 품목이므로 매장 재고와 사이즈를 확인해 주십시오. 호흡 보호가 함께 필요하면 방진·방독마스크 상황을 참고하십시오."}
 ]}

 {g:"던에드워드 · 도장 마감",items:[
   {q:"실내 벽면을 최고급으로, 오염·흠집까지 강하게 칠하고 싶어요",rec:["EXQUISITE 익스-퀴짓","EVEREST"],why:"익스-퀴짓은 크로마스테이™ 세라믹 기술의 디럭스 인테리어 무광으로 일상 오염 얼룩을 쉽게 지우고 흠집·가벼운 충격 벗겨짐을 막아 거실·아이방·침실·복도·천장·교실·사무실에 적합합니다. 에베레스트는 100% 아크릴 셀프 프라이밍 최고급 내부용으로 무광·벨벳·계란광·반광택까지 광택을 고를 수 있습니다.",ref:{url:"https://jh2y24-tech.github.io/dunn-edwards-guide/",label:"던에드워드 시공·지식 가이드"}},
   {q:"오래가고 잘 닦이는 계란광 실내 벽면",rec:["SUPREMA","EVEREST"],why:"슈프리마는 100% 아크릴 셀프 프라이밍 계란광으로 내세척성 4,000회 이상, 은폐력·얼룩 저항이 좋아 고급 주거·상업에 적합합니다. 광택 선택 폭이 필요하면 에베레스트."},
   {q:"학교·병원·복도처럼 사람이 많이 다니는 실내",rec:["SPARTAWALL","EVEREST"],why:"스파르타월은 무 VOC급(무광 15g/L)·Green Wise GOLD 프리미엄 아크릴로 학교·병원·복도·교실·사무실에 두루 쓰고 무광~반광택까지 광택 선택이 넓습니다."},
   {q:"외벽(치장벽토·벽돌·목재·금속)을 오래가게 칠하고 싶어요",rec:["EVERSHIELD","ACRI-BUILD Flat"],why:"에버쉴드는 100% 아크릴 최고급 내·외부용으로 치장벽토·석조·벽돌·목재·알루미늄·비닐·금속에 무광~유광까지 폭넓게 대응합니다. 넓은 면적의 전문가용 무광 마감은 아크리빌드 플랫이 경제적입니다."},
   {q:"문·몰딩·캐비닛·가구 트림을 매끈하게 마감",rec:["DECOGLO Eggshell","ARISTOSHIELD"],why:"데코글로 계란광은 우레탄 변성 아크릴 내부용으로 가구·캐비닛·도어·트림(내부 목재)에 적합합니다. 출입문·난간·차고문·금속까지 더 강한 마감이 필요하면 아리스토쉴드(수성 우레탄 알키드, 계란광~고광택)."},
   {q:"신축 석고보드(드라이월) 도장 전 바탕 처리",rec:["PREP-WALL 프렙월","VINYLASTIC Premium"],why:"프렙월은 실내 석고보드 표면 컨디셔너(물퍼티)로 레벨5 마감 바탕을 만듭니다. 드라이월 실러가 필요하면 바이널라스틱 프리미엄(수성 공중합체, 5g/L)."},
   {q:"곰팡이 핀 벽을 살균하고 바탕 잡기",rec:["ZINSSER 몰드킬링 (Mold Killing Primer)"],why:"진저 몰드킬링은 실내·외 곰팡이 살균 수성 프라이머로 베란다·욕실·지하 등 곰팡이 발생 벽면의 살균·바탕 처리에 씁니다."},
   {q:"매끈한 면·시트지·아연도금 등 안 붙는 표면 접착 밑작업",rec:["ULTRA-GRIP Premium","BLOCK-IT Premium"],why:"울트라그립은 내·외부 접착 프라이머로 매끈한 면·합성 목재·아연 도금에 부착력을 만듭니다. 얼룩까지 함께 잡아야 하면 블록잇 프리미엄(수성 알키드, 내·외부 얼룩 차단)."},
   {q:"금속·철 녹 방지 밑칠과 금속 마감",rec:["BLOC-RUST Premium","ULTRASHIELD Galvanized Metal Primer","ARISTOSHIELD"],why:"철 함유 금속은 블록러스트(반응성 안료 녹 방지 프라이머). 아연도금·알루미늄·구리·황동은 울트라쉴드 아연도금 금속 프라이머. 마감 도장은 아리스토쉴드로 이어갑니다."},
   {q:"외부 목재 문·창·트림·울타리 밑칠",rec:["EZ-PRIME Premium 이지프라임","DECOPRIME"],why:"이지프라임은 외부 전용 100% 아크릴 목재 프라이머로 외부 목재 문·창·트림·울타리·합판·T1-11 사이딩에 씁니다. 내부 목재 트림·도어는 데코프라임."},
   {q:"병원·학교·상업시설 금속·목재 산업 유지보수 도장",rec:["ENDURACAT 엔듀라캣","ENDURA-COAT"],why:"엔듀라캣은 수성 아크릴 에폭시(사전 촉매) 내부용 반광으로 병원·학교·호텔·상업의 내부 금속·목재·건식벽·석조에 적합합니다. 내·외부 경량 산업용은 엔듀라코트."},
   {q:"지하 벽·기초·욕실 타일 방수 페인트",rec:["DAMPLOCK 덤프록"],why:"덤프록은 수성 아크릴 방수 페인트(저 VOC·저취·즉시 사용)로 지하 벽면·바닥 기초·옹벽·욕실 타일에 씁니다."},
   {q:"콘크리트·벽돌·석재 수직 벽면 투명 발수(방수)",rec:["ORIGINAL 오리지날"],why:"오리지날은 수성 아크릴 투명 방수·발수재(무광, 건조 후 투명)로 콘크리트·벽돌·석재 수직 벽면·사이딩·회벽에 씁니다."},
   {q:"결로·곰팡이 걱정되는 벽/베란다 단열",rec:["INSULADD 인슐래드"],why:"인슐래드는 세라믹 단열·차열 페인트 첨가제로, 도료에 혼합해 결로·곰팡이 우려 벽면·베란다·지하·외벽 단열에 씁니다."},
   {q:"콘크리트 바닥(옥상·주차장·차도) 도장·씰링",rec:["EPOXY-SEAL 에폭시-씰","CLEAR-SEAL 클리어씰","LOCK-DOWN 락다운"],why:"에폭시-씰은 수성 아크릴 에폭시 콘크리트 바닥 페인트로 옥상·주차장·차도·수영장 데크·지하 테라스 바닥에 씁니다. 콘크리트 보호 투명 씰은 클리어씰, 바닥 접착 밑작업은 락다운."},

/* ===== 렌더: 과목별 학습 ===== */
var catbar=document.getElementById('catbar'),panel=document.getElementById('panel');
var activeCat=CATS[0].key;
function buildCatbar(){
  var h="";
  CATS.forEach(function(c,i){
    h+="<button data-cat='"+esc(c.key)+"' aria-current='"+(c.key===activeCat)+"'>"+(i+1)+". "+esc(c.key)+"<span class='n'>"+prodsOf(c.key).length+"</span></button>";
  });
  catbar.innerHTML=h;
  Array.prototype.forEach.call(catbar.querySelectorAll('button'),function(b){
    b.onclick=function(){activeCat=b.getAttribute('data-cat');buildCatbar();renderPanel();window.scrollTo({top:0,behavior:'smooth'});};
  });
}
function statRow(k,v){return (v&&String(v).trim()&&v!=='-')?("<div class='pstat'><span class='pk'>"+k+"</span><span class='pv'>"+esc(v)+"</span></div>"):"";}
function shortDesc(p){if(!p.desc)return"";var t=p.desc.split(/(?<=다[.])|(?<=니다[.])|[.]\s/)[0].trim();return t.length>42?t.slice(0,41)+"…":t;}
function renderPanel(){
  var idx=CATS.map(function(c){return c.key;}).indexOf(activeCat);
  var c=CATS[idx],list=prodsOf(activeCat);
  var h="<div class='panel-head'><span class='panel-num'>과목 "+(idx+1)+"</span><h2 class='panel-title'>"+esc(activeCat)+"</h2></div>";
  h+="<p class='panel-intro'>"+c.intro+"</p>";
  h+="<div class='count-line'>제품 "+list.length+"개 · 카드를 누르면 상세 학습 카드가 열립니다</div>";
  h+="<div class='pgrid'>";
  list.forEach(function(p){
    var img=imgOf(p);
    var stats=statRow('사용량',p.usage)+statRow('경화',p.curing)+statRow('포장',p.packaging);if(!stats){var sd=shortDesc(p);if(sd)stats=statRow('특징',sd);}
    var use=shortUse(p);
    h+="<button class='pcard' data-name='"+esc(p.name)+"'>"+
       "<img class='pcard-thumb' src='"+img+"' alt='"+esc(p.name)+"' loading='lazy' onerror=\"this.onerror=null;this.src=ph('"+esc(p.category)+"')\">"+
       "<div class='pcard-body'>"+
         (p.unstocked?"<span style='align-self:flex-start;font-size:12px;font-weight:800;color:#8A5A34;background:#FDF3E7;border:1px solid #F0D3AC;padding:4px 10px;border-radius:999px;margin-bottom:2px'>취급안함 · 참고용</span>":"")+
         "<div class='pcard-name'>"+esc(p.name)+"</div>"+
         (p.spec&&p.spec.trim()?"<span class='pcard-spec'>"+esc(p.spec)+"</span>":"")+
         (stats?"<div class='pcard-stats'>"+stats+"</div>":"")+
         (use?"<div class='pcard-use'>"+esc(use)+"</div>":"")+
         "<div class='pcard-go'>학습카드 열기 →</div>"+
       "</div></button>";
  });
  h+="</div>";
  panel.innerHTML=h;
  Array.prototype.forEach.call(panel.querySelectorAll('.pcard'),function(bt){bt.onclick=function(){openDetail(get(bt.getAttribute('data-name')));};});
}


/* ===== 렌더: 상황별 응대 ===== */
function renderSit(){
  var h="<p class='sit-intro'>고객이 자주 하는 말입니다. 상황을 고르면 추천 제품과 이유가 나옵니다. 제품을 누르면 상세 학습 카드가 열립니다.</p>";
  SIT.forEach(function(grp){
    h+="<div class='sit-group'><div class='sit-gt'>"+esc(grp.g)+"</div><div class='sit-grid'>";
    grp.items.forEach(function(it){
      h+="<div class='sit-card'><div class='sit-q'>"+esc(it.q)+"</div><div class='sit-ans'>"+(it.rec&&it.rec.length?"<div class='sit-lead'>이 제품을 안내해주세요</div>":"")+"<div class='rec'>";
      it.rec.forEach(function(nm,i){
        if(get(nm)) h+="<button data-name='"+esc(nm)+"' class='"+(i===0?'first':'')+"'>"+esc(nm)+"</button>";
        else h+="<button class='pending' disabled title='제품 카탈로그를 불러오는 중입니다'>"+esc(nm)+" …</button>";
      });
      h+="</div><div class='why'>"+esc(it.why)+"</div>"+(it.ref?"<a class='sit-ref' href='"+esc(it.ref.url)+"' target='_blank' rel='noopener'>"+esc(it.ref.label)+" ↗</a>":"")+"</div></div>";
    });
    h+="</div></div>";
  });
  var v=document.getElementById('viewSit');v.innerHTML=h;
  Array.prototype.forEach.call(v.querySelectorAll('button[data-name]'),function(b){
    b.onclick=function(){openDetail(get(b.getAttribute('data-name')));};
  });
  Array.prototype.forEach.call(v.querySelectorAll('.rec'),function(row){
    var bs=row.querySelectorAll('button'),n=bs.length,A=[0,52,59],B=[110,181,188];
    function C(t){return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';}
    Array.prototype.forEach.call(bs,function(b,i){ b.style.backgroundImage='linear-gradient(90deg,'+C(n>1?i/n:0)+' 0%,'+C(n>1?(i+1)/n:1)+' 100%)'; });
  });
}

function openGuide(url,title){var g=document.getElementById("gview");document.getElementById("gviewTitle").textContent=title||"시공 가이드";document.getElementById("gviewFrame").src=url;document.getElementById("gviewOpen").href=url;g.classList.add("open");document.body.style.overflow="hidden";return false;}
function closeGuide(){var g=document.getElementById("gview");g.classList.remove("open");document.getElementById("gviewFrame").src="about:blank";document.body.style.overflow="";}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){var g=document.getElementById("gview");if(g&&g.classList.contains("open"))closeGuide();}});

/* ===== 검색 ===== */
function _expandTok(t){var G=[['방수','방습','누수'],['철재','철제'],['나무','목재'],['욕실','화장실'],['베란다','발코니'],['크랙','균열','갈라짐'],['빠데','퍼티'],['부식','녹'],['충진','충전','메움','채움','채워','메꿈'],['틈','틈새'],['도장','칠','페인트'],['줄눈','메지']];var out=[t];for(var i=0;i<G.length;i++){if(G[i].indexOf(t)>-1)out=out.concat(G[i]);}return out;}
var _QSURF=['화장실','욕실','베란다','발코니','옥상','슬라브','지하','외벽','외부','내벽','벽면','벽체','바닥','마루','천장','타일','데코타일','콘크리트','조적','몰탈','목재','나무','철재','철제','금속','창틀','창호','샤시','문틀','몰딩','석고보드','벽지','데크','지붕','수영장','가구','석재','우레탄'];
var _QACT=['방수','방습','누수','도장','마감','접착','줄눈','보수','충진','메움','흠집','틈새','틈','코팅','단열','미장','수평','방청','실링','칠','페인트','부착','충전','채움'];
function _split(t){for(var i=0;i<_QACT.length;i++){var a=_QACT[i];if(t.length>a.length&&t.slice(-a.length)===a){var s=t.slice(0,t.length-a.length);if(_QSURF.indexOf(s)>-1)return [s,a];}}return null;}
function _qtoks(q){var raw=q.trim().toLowerCase().split(/\s+/).filter(Boolean);var out=[];raw.forEach(function(r){var sp=_split(r);if(sp){out.push(sp[0]);out.push(sp[1]);}else out.push(r);});return out;}
function _hay(p){var s=p.name+' '+p.category+' '+(p.usage||'')+' '+(p.spec||'')+' '+(p.curing||'')+' '+(p.desc||'')+' '+(p.uses||'')+' '+(p.keywords||'');if(p.cautions&&p.cautions.join)s+=' '+p.cautions.join(' ');if(p.methods)p.methods.forEach(function(m){s+=' '+(m.title||'')+' '+((m.steps||[]).join(' '));});return s.toLowerCase();}
function _match(hay,q){var toks=_qtoks(q);if(!toks.length)return false;return toks.every(function(t){var sy=_expandTok(t);for(var i=0;i<sy.length;i++){var y=sy[i];var ok=(y==='외벽')?/(?<!지하)외벽/.test(hay):(hay.indexOf(y)>-1);if(ok)return true;}return false;});}
function renderSearch(q){
  var v=document.getElementById('viewSearch');
  var list=PRODUCTS.filter(function(p){return _match(_hay(p),q);});
  var h="<div class='count-line'>'"+esc(q)+"' 검색결과 "+list.length+"개</div>";
  if(!list.length){h+="<div class='empty'><img src='"+MARK+"' alt=''><div class='big'>검색 결과가 없습니다</div><div>다른 제품명이나 용도로 다시 검색해 보세요.</div></div>";v.innerHTML=h;return;}
  h+="<div class='sr-list'>";
  list.forEach(function(p){
    h+="<button class='sr-item' data-name='"+esc(p.name)+"'><span class='sr-cat'>"+esc(p.category)+"</span><span><span class='sr-name'>"+esc(p.name)+"</span><span class='sr-sub'>"+esc(shortUse(p)||p.spec||"")+"</span></span><span class='sr-go'>→</span></button>";
  });
  h+="</div>";v.innerHTML=h;
  Array.prototype.forEach.call(v.querySelectorAll('.sr-item'),function(b){b.onclick=function(){openDetail(get(b.getAttribute('data-name')));};});
}

/* ===== 탭 / 뷰 전환 ===== */
var tabLearn=document.getElementById('tabLearn'),tabSit=document.getElementById('tabSit');
var vLearn=document.getElementById('viewLearn'),vSit=document.getElementById('viewSit'),vSearch=document.getElementById('viewSearch');
var input=document.getElementById('q'),sw=document.getElementById('searchwrap');
function showView(which){
  vLearn.classList.toggle('on',which==='learn');
  vSit.classList.toggle('on',which==='sit');
  vSearch.classList.toggle('on',which==='search');
  if(which!=='search'){tabLearn.setAttribute('aria-selected',which==='learn');tabSit.setAttribute('aria-selected',which==='sit');}
}
tabLearn.onclick=function(){input.value="";sw.classList.remove('on');showView('learn');window.scrollTo({top:0,behavior:'smooth'});};
tabSit.onclick=function(){input.value="";sw.classList.remove('on');if(!vSit.dataset.built){renderSit();vSit.dataset.built="1";}showView('sit');window.scrollTo({top:0,behavior:'smooth'});};
input.addEventListener('input',function(e){
  var q=e.target.value;sw.classList.toggle('on',q.length>0);
  if(q.trim()===""){showView(tabSit.getAttribute('aria-selected')==='true'?'sit':'learn');return;}
  renderSearch(q);showView('search');
});
document.getElementById('qx').onclick=function(){input.value="";sw.classList.remove('on');input.focus();showView(tabSit.getAttribute('aria-selected')==='true'?'sit':'learn');};

/* ===== 검색 자동완성 (제품/검색어 2섹션 · 보수의도 우선) ===== */
var acBox=document.getElementById('ac'),acItems=[],acIdx=-1;
var PROD_POOL=PRODUCTS.map(function(p){return {name:p.name,hay:_hay(p),prod:p};});
var TERM_POOL=(function(){var seen={},arr=[];PRODUCTS.forEach(function(p){(p.keywords||'').split(',').forEach(function(w){w=w.trim();if(w.length>=2&&!/\d/.test(w)){var k=w.toLowerCase();if(!seen[k]){seen[k]=1;arr.push(w);}}});});return arr;})();
var AC_INTENT=['보수','깨짐','흠집','틈','크랙','균열','누수','메움','메우','대용','방수','충진','자국'];
function acHasIntent(t){for(var i=0;i<AC_INTENT.length;i++){if(t.indexOf(AC_INTENT[i])>-1)return true;}return false;}
var IC_PROD="<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><rect x='3' y='3' width='18' height='18' rx='3'/><path d='M8 9h8M8 13h5'/></svg>";
var IC_TERM="<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>";
function hiliteAC(t,q){var i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+"<b>"+esc(t.slice(i,i+q.length))+"</b>"+esc(t.slice(i+q.length));}
function acRow(i,text,type,q){return "<button class='ac-item' role='option' data-i='"+i+"'><span class='ac-ic'>"+(type==='product'?IC_PROD:IC_TERM)+"</span><span class='ac-tx'>"+hiliteAC(text,q)+"</span>"+(type==='product'?"<span class='ac-badge'>제품</span>":"")+"</button>";}
function renderAC(q){
  q=q.trim();if(q.length<1){acBox.classList.remove('on');acItems=[];acIdx=-1;return;}
  var lq=q.toLowerCase();
  var prod=PROD_POOL.filter(function(o){return _match(o.hay,lq);});
  prod.sort(function(a,b){function tr(o){var n=o.name.toLowerCase();if(n.indexOf(lq)===0)return 0;if(n.indexOf(lq)>-1)return 1;return 2;}var d=tr(a)-tr(b);if(d)return d;return a.name.length-b.name.length;});
  prod=prod.slice(0,5);
  var pn={};prod.forEach(function(o){pn[o.name.toLowerCase()]=1;});
  var terms=TERM_POOL.filter(function(t){return t.toLowerCase().indexOf(lq)>-1 && !pn[t.toLowerCase()];});
  terms.sort(function(a,b){function tr(t){var st=t.toLowerCase().indexOf(lq)===0,ii=acHasIntent(t);if(st&&ii)return 0;if(st)return 1;if(ii)return 2;return 3;}var d=tr(a)-tr(b);if(d)return d;return a.length-b.length;});
  terms=terms.slice(0,6);
  acItems=[];var h='';
  if(prod.length){h+="<div class='ac-head'>제품</div>";prod.forEach(function(o){var i=acItems.length;acItems.push({t:o.name,type:'product'});h+=acRow(i,o.name,'product',q);});}
  if(terms.length){h+="<div class='ac-head'>검색어</div>";terms.forEach(function(t){var i=acItems.length;acItems.push({t:t,type:'term'});h+=acRow(i,t,'term',q);});}
  if(!acItems.length){acBox.classList.remove('on');return;}
  acBox.innerHTML=h;acBox.classList.add('on');acIdx=-1;
  Array.prototype.forEach.call(acBox.querySelectorAll('.ac-item'),function(bt){
    bt.addEventListener('mousedown',function(ev){ev.preventDefault();pickAC(parseInt(bt.getAttribute('data-i'),10));});
    bt.addEventListener('mousemove',function(){setActiveAC(parseInt(bt.getAttribute('data-i'),10));});});
}
function setActiveAC(i){acIdx=i;Array.prototype.forEach.call(acBox.querySelectorAll('.ac-item'),function(bt){bt.classList.toggle('active',parseInt(bt.getAttribute('data-i'),10)===i);});}
function pickAC(i){var o=acItems[i];if(!o)return;acBox.classList.remove('on');if(o.type==='product'){var pr=get(o.t);if(pr){openDetail(pr);return;}}input.value=o.t;sw.classList.add('on');renderSearch(o.t);showView('search');}
input.addEventListener('input',function(e){renderAC(e.target.value);});
input.addEventListener('keydown',function(e){if(!acBox.classList.contains('on'))return;
  if(e.key==='ArrowDown'){e.preventDefault();setActiveAC((acIdx+1)%acItems.length);}
  else if(e.key==='ArrowUp'){e.preventDefault();setActiveAC((acIdx-1+acItems.length)%acItems.length);}
  else if(e.key==='Enter'){if(acIdx>=0){e.preventDefault();pickAC(acIdx);}}
  else if(e.key==='Escape'){acBox.classList.remove('on');}});
document.addEventListener('click',function(e){if(!sw.contains(e.target))acBox.classList.remove('on');});
document.getElementById('qx').addEventListener('click',function(){acBox.classList.remove('on');});

/* ===== 제품 학습 카드 (상세) ===== */
var overlay=document.getElementById('overlay'),detailBody=document.getElementById('detailBody'),detail=document.getElementById('detail'),lastFocused=null,currentCatalog=null;
function ksgPlayAll(){var vs=detailBody.querySelectorAll('video');Array.prototype.forEach.call(vs,function(v){v.muted=true;v.setAttribute('muted','');var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});});}
function openDetail(p){
  if(!p)return;
  lastFocused=document.activeElement;currentCatalog=p.catalog||null;
  if(p.html){
    detailBody.innerHTML=p.html;
    [200,600,1200,2000].forEach(function(ms){setTimeout(ksgPlayAll,ms);});
    var resume=function(){ksgPlayAll();};document.addEventListener('pointerdown',resume,{passive:true});
  } else {
    detailBody.innerHTML=buildDetail(p);
    var cb=document.getElementById('catBtn');if(cb)cb.onclick=openCatalog;
    var dbs=detailBody.querySelectorAll('.doc-b');
    Array.prototype.forEach.call(dbs,function(b){
      b.onclick=function(){
        var d=(p.docs||[])[+b.getAttribute('data-doc')]; if(!d)return;
        currentCatalog=d.url; openCatalogUrl(d.url,d.fallback,d.label);
      };
    });
  }
  (function(){
    if(!(p&&p.altRec&&p.altRec.targets&&p.altRec.targets.length))return;
    if(detailBody.querySelector('.altrec'))return;
    var c=document.createElement('div');c.className='altrec';
    var hh="<div class='altrec-h'><span class='altrec-badge'>\uc5f0\uacc4 \uc548\ub0b4</span>\ud615\uc81c\uc0c1\uc0ac \ucde8\uae09 \uc81c\ud488\uc73c\ub85c \uc548\ub0b4</div>";
    if(p.altRec.note)hh+="<p class='altrec-note'>"+esc(p.altRec.note)+"</p>";
    hh+="<div class='altrec-btns'>";
    p.altRec.targets.forEach(function(nm){hh+="<button type='button' class='plink altrec-chip' data-name='"+esc(nm)+"'>"+esc(nm)+" <span class='arw'>\u2192</span></button>";});
    hh+="</div>";c.innerHTML=hh;
    var host=detailBody.firstElementChild||detailBody;host.insertBefore(c,host.firstChild);
  })();
  Array.prototype.forEach.call(detailBody.querySelectorAll('.term[data-name]'),function(t){t.onclick=function(){openTerm(t.getAttribute('data-name'));};});
  Array.prototype.forEach.call(detailBody.querySelectorAll('.plink[data-name]'),function(t){t.onclick=function(){var pr=get(t.getAttribute('data-name'));if(pr)openDetail(pr);};});
  (function(){var fab=document.getElementById('altFab');if(!fab)return;if(p&&p.altRec&&p.altRec.targets&&p.altRec.targets.length){var _t=p.altRec.targets[0];fab.innerHTML="<span class='af-ic'>\u2794</span><span class='af-nm'>"+esc(_t)+" 로 안내</span>";fab.onclick=function(){var pr=get(_t);if(pr)openDetail(pr);};fab.classList.add('show');}else{fab.classList.remove('show');fab.onclick=null;}})();
  detail.scrollTop=0;overlay.classList.add('open');document.body.style.overflow='hidden';
  toTopDetail.classList.remove('show');
  document.getElementById('close').focus();
}
function firstSentence(t){if(!t)return"";var m=t.split(/(?<=다[.])|(?<=니다[.])|[.]\s/)[0];return m.trim();}
function buildDetail(p){
  var h=imgOf(p)?("<img class='d-hero' src='"+imgOf(p)+"' alt='"+esc(p.name)+"' onerror=\"this.style.display='none'\">"):"";
  h+="<div class='d-cat'>"+esc(p.category)+"</div><div class='d-name'>"+esc(p.name)+"</div>";
  if(p.unstocked)h+="<div style='display:flex;align-items:flex-start;gap:9px;background:#FDF3E7;border:1px solid #F0D3AC;border-radius:12px;padding:12px 14px;margin:6px 0 4px'><span style='flex:none;width:19px;height:19px;background:#D97A16;color:#fff;border-radius:50%;font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px'>!</span><span style='font-size:13.5px;font-weight:700;color:#5A4321;line-height:1.55'>매장에서 취급하지 않는 제품입니다. 고객 문의 시 참고용 정보입니다.</span></div>";
  if(p.altRec&&p.altRec.targets&&p.altRec.targets.length){
    h+="<div class='altrec'><div class='altrec-h'><span class='altrec-badge'>연계 안내</span>형제상사 취급 제품으로 안내</div>";
    if(p.altRec.note)h+="<p class='altrec-note'>"+esc(p.altRec.note)+"</p>";
    h+="<div class='altrec-btns'>";
    p.altRec.targets.forEach(function(nm){h+="<button type='button' class='plink altrec-chip' data-name='"+esc(nm)+"'>"+esc(nm)+" <span class='arw'>\u2192</span></button>";});
    h+="</div></div>";
  }
  var one=firstSentence(p.desc);
  if(one)h+="<div class='d-one'>"+esc(one)+"</div>";
  var cells=[];
  if(p.stats&&p.stats.length){p.stats.forEach(function(s){cells.push("<div class='spec'><div class='k'>"+esc(s.k)+"</div><div class='v'>"+esc(s.v)+"</div></div>");});}
  else{
    var uu=(p.usage||"").trim(), cu=(p.curing&&p.curing!=='-')?p.curing.trim():"";
    if(uu||cu){cells.push("<div class='spec'><div class='k'>표준 사용량</div><div class='v'>"+esc(uu||"–")+"</div></div>");cells.push("<div class='spec'><div class='k'>경화 · 건조</div><div class='v'>"+esc(cu||"–")+"</div></div>");}
  }
  if(cells.length)h+="<div class='specs'>"+cells.join("")+"</div>";
  var info=[];
  if(p.spec)info.push("<div>규격<b>"+esc(p.spec)+"</b></div>");
  if(p.packaging)info.push("<div>포장<b>"+esc(p.packaging)+"</b></div>");
  if(p.color&&p.color!=="-")info.push("<div>외관<b>"+esc(p.color)+"</b></div>");
  if(info.length)h+="<div class='info'>"+info.join("")+"</div>";
  if(p.catalog&&!(p.docs&&p.docs.length))h+="<button class='pdf-btn' id='catBtn'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><path d='M14 2v6h6'/></svg>제품 안내서(PDF) 보기<span class='arw'>→</span></button>";
  if(p.docs&&p.docs.length){
    h+="<div class='doc-links'>";
    p.docs.forEach(function(d,di){
      h+="<button class='pdf-btn doc-b' data-doc='"+di+"'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><path d='M14 2v6h6'/></svg>"+esc(d.label)+"<span class='arw'>→</span></button>";
    });
    h+="</div>";
  }
  if(p.desc)h+="<div class='sec'><h3>제품 설명</h3><p class='desc-p'>"+esc(p.desc)+"</p></div>";
  if(p.uses)h+="<div class='sec'><h3>용도</h3><div class='uses-box'>"+esc(p.uses)+"</div></div>";
  if(p.filters)h+="<div class='sec'><h3>결합 필터 · 정화통</h3><div class='uses-box'>"+esc(p.filters)+"</div></div>";
  var vids=(p.videos&&p.videos.length)?p.videos:(p.video?[p.video]:[]);if(vids.length){h+="<div class='sec'><h3>시공 영상</h3><div style='display:flex;flex-direction:column;gap:10px'>";vids.forEach(function(vid){h+="<div style='position:relative;width:100%;padding-bottom:56.25%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000'><iframe src='https://www.youtube.com/embed/"+esc(vid)+"' title='시공 영상' loading='lazy' allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture' allowfullscreen style='position:absolute;inset:0;width:100%;height:100%;border:0'></iframe></div>";});h+="</div></div>";}
  if(p.videoFile){h+="<div class='sec'><h3>제품 영상</h3><div style='position:relative;width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000'><video src='"+esc(p.videoFile)+"' autoplay muted loop playsinline controls preload='metadata' style='width:100%;display:block'></video></div></div>";}
  if(p.methods&&p.methods.length){
    h+="<div class='sec'><h3>시공법</h3>";
    p.methods.forEach(function(m,i){h+="<details class='method'"+(i===0?" open":"")+"><summary>"+esc(m.title)+"<span class='arw'>▸</span></summary><ol>";m.steps.forEach(function(s){h+="<li>"+linkTerms(s,p.name)+"</li>";});h+="</ol></details>";});
    h+="</div>";
  }
  if(p.cautions&&p.cautions.length){h+="<div class='sec'><h3>주의사항</h3><ul class='cautions'>";p.cautions.forEach(function(c){h+="<li>"+esc(c)+"</li>";});h+="</ul></div>";}
  if(p.primerLink&&p.primerLink.target){var pl=p.primerLink;h+="<div class='sec'><h3>지정 프라이머</h3><div class='primer-box'>"+(pl.note?"<p class='primer-note'>"+esc(pl.note)+"</p>":"")+"<button type='button' class='plink' data-name='"+esc(pl.target)+"'>"+esc(pl.target)+"</button></div></div>";}
  if(p.detailImages&&p.detailImages.length){h+="<div class='sec'><h3>"+esc(p.imagesTitle||'상세 정보')+"</h3><div style='display:flex;flex-direction:column;gap:8px'>";p.detailImages.forEach(function(src,ii){
      var alt2=(p.detailImagesAlt&&p.detailImagesAlt[ii])?p.detailImagesAlt[ii]:"";
      h+="<img src='"+esc(src)+"' data-alt2='"+esc(alt2)+"' alt='"+esc(p.name)+" 상세 이미지' loading='lazy' style='display:block;width:100%;height:auto;border-radius:12px;border:1px solid #D7E0DE;background:#fff;cursor:zoom-in' onclick=\"zoomImg(this.src)\" onerror=\"var a=this.getAttribute('data-alt2');if(a&&!this.dataset.tried){this.dataset.tried='1';this.src=a;}else{this.style.display='none';}\" />";
    });h+="</div></div>";}
  if(p.extLink&&p.extLink.url){h+="<div class='sec'><a href='"+esc(p.extLink.url)+"' target='_blank' rel='noopener noreferrer' style='display:block;text-align:center;background:#004750;color:#fff;font-weight:800;font-size:14.5px;padding:14px 16px;border-radius:12px;text-decoration:none'>"+esc(p.extLink.label||'공식 홈페이지 바로가기')+" \u2197</a></div>";}

function openCatalog(url){var c=(typeof url==="string"&&url)?url:currentCatalog;if(!c)return;document.getElementById('viewerTitle').textContent="제품 안내서";var vo=document.getElementById('viewerOpen');if(vo)vo.href=c;viewer.classList.add('open');renderPdf(c);}
function pdfIframeFallback(url){
  pdfScroll.innerHTML="<iframe src='"+url+"' title='제품 안내서' style='width:100%;height:100%;border:0;background:#fff'></iframe><div class='pdf-load' style='padding:14px'>안내서가 보이지 않으면 상단 ‘새 탭 ↗’을 눌러 주세요.</div>";
}
function renderPdf(url){
  var my=++pdfToken;
  pdfScroll.scrollTop=0;
  pdfScroll.innerHTML="<div class='pdf-load'>안내서를 불러오는 중…</div>";
  if(!window.pdfjsLib){pdfIframeFallback(url);return;}
  try{pdfjsLib.GlobalWorkerOptions.workerSrc=(window.__pdfBase||"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174")+"/pdf.worker.min.js";}catch(e){}
  pdfjsLib.getDocument(url).promise.then(function(pdf){
    if(my!==pdfToken)return;
    pdfScroll.innerHTML="";
    var maxW=Math.min(pdfScroll.clientWidth-28,900);if(maxW<200)maxW=Math.min(window.innerWidth-40,900);
    var dpr=Math.min(window.devicePixelRatio||1,2);
    var chain=Promise.resolve();
    var render=function(num){return pdf.getPage(num).then(function(page){
      if(my!==pdfToken)return;
      var vp1=page.getViewport({scale:1});var sc=maxW/vp1.width;var vp=page.getViewport({scale:sc*dpr});
      var canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;canvas.style.width=(vp.width/dpr)+'px';
      pdfScroll.appendChild(canvas);
      return page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    });};
    for(var n=1;n<=pdf.numPages;n++){(function(num){chain=chain.then(function(){return render(num);});})(n);}
    return chain;
  }).catch(function(err){
    if(my!==pdfToken)return;
    pdfIframeFallback(url);
  });
}

/* ══════════ 브랜드 카탈로그 로더 ══════════

   - 원본은 각 브랜드 레포에 있고 여기서는 복사본을 두지 않는다.

   상황별 응대에서 브랜드 제품을 열 때 이 영상이 함께 표시된다. */

/* 여러 주소를 순서대로 시도한다 (Pages 미배포 시 raw 로 폴백) */
function fetchFirst(urls,key){
  var i=0, why=[];
  function next(){
    if(i>=urls.length) return Promise.reject(new Error(why.join(" | ")));
    var u=urls[i++];
    return fetch(u,{cache:"no-cache"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .catch(function(e){
        var short=u.replace(/^https?:\/\//,"").split("/")[0];
        why.push(short+" → "+e.message);
        console.warn("  ↳ "+key+" 시도 실패: "+u+" ("+e.message+")");
        return next();
      });
  }
  return next();
}

/* 삼화 products.json 스키마 → 핸드북 제품 카드 스키마 */
function samhwaToCard(p){
  var sp=p.spec||{}, cat="페인트";
  var c=(p.categories||[]).join(",");
  if(p.role==="primer") cat="프라이머";
  else if(p.role==="filler") cat="퍼티";
  else if(/wp/.test(c)) cat="방수재";
  else if(/floor|road/.test(c)) cat="페인트";
  var pack=(sp.pack_sizes||[]).join(", ");
  var col=(sp.colors||[]).join(", ")||sp.colors_note||"-";
  var stats=[];
  if(sp.coverage_m2_per_l) stats.push({k:"이론도포면적",v:sp.coverage_m2_per_l+" ㎡/L"});
  if(sp.recoat_hours) stats.push({k:"재도장 간격",v:sp.recoat_hours+"시간"});
  if(sp.thinning_pct_max) stats.push({k:"최대 희석률",v:sp.thinning_pct_max+"%"});
  if(sp.composition) stats.push({k:"구성",v:sp.composition});
  stats.push({k:"제조",v:p.brand||"삼화페인트"});
  var warn=((p.cautions||{}).warn)||[], info=((p.cautions||{}).info)||[];
  var SB="https://jh2y24-tech.github.io/paint-guide-samhwa/pdf/";
  var SR="https://raw.githubusercontent.com/jh2y24-tech/paint-guide-samhwa/main/pdf/";
  var dc=p.docs||{}, docs=[];
  if(dc.tech) docs.push({label:"기술 자료 (PDF)",url:SB+dc.tech,fallback:SR+dc.tech});
  if(dc.spec_sheet) docs.push({label:"도장사양서 (PDF)",url:SB+dc.spec_sheet,fallback:SR+dc.spec_sheet});
  return {name:p.name,category:cat,spec:sp.composition||p.name_en||"",
    usage:sp.coverage_note||"",curing:sp.cure_note||"",packaging:pack,color:col,
    desc:(p.summary||"")+(p.staff_note?" "+p.staff_note:""),uses:p.uses||"",
    cautions:warn.concat(info),image:"",catalog:(docs[0]?docs[0].url:""),docs:docs,detailImages:[],stats:stats,
    keywords:[p.name,p.name_en].concat(p.aliases||[]).filter(Boolean).join(", "),
    methods:[],aliases:(p.aliases||[]),_brand:"삼화페인트",_status:p.status};
}

/* 던에드워드 dunn_edwards_data.json 스키마 → 핸드북 제품 카드 스키마 */
function dunnToCard(p){
  var DB="https://jh2y24-tech.github.io/dunn-edwards-guide/";
  var c=p.category||"", cat="페인트";
  if(c==="primer") cat="프라이머";
  else if(c==="waterproof") cat="방수재";
  var stats=[];
  if(p.tier) stats.push({k:"등급",v:p.tier});
  if(p.type) stats.push({k:"유형",v:p.type});
  if(p.sheens&&p.sheens.length) stats.push({k:"광택",v:p.sheens.join(", ")});
  stats.push({k:"제조",v:"Dunn-Edwards (던에드워드)"});
  var desc=p.desc||"";
  if(p.features&&p.features.length) desc+=" 주요 특징 — "+p.features.join(" · ")+".";
  var im=(p.image||p.title_img||"").trim();
  var img=im?(/^https?:/.test(im)?im:DB+im):"";
  return {name:p.name,category:cat,spec:"",usage:"",curing:"",packaging:"",
    color:(p.sheens||[]).join(", ")||"-",desc:desc,uses:p.surfaces||"",
    cautions:[],image:img,catalog:"",docs:[],detailImages:[],stats:stats,
    keywords:[p.name,p.code].concat(p.aliases||[]).filter(Boolean).join(", "),
    methods:[],_brand:"던에드워드",_site:DB,_status:p.status};
}

function loadBrandCatalogs(){
  var jobs=BRAND_SOURCES.map(function(src){
    return fetchFirst(src.urls,src.key)
      .then(function(db){
        var list=(db.products||db||[]);
        var cards=list.map(function(p){
          var card=(src.type==="samhwa")?samhwaToCard(p):(src.type==="dunn")?dunnToCard(p):Object.assign({},p);
          card._brand=card._brand||src.label; card._site=src.site;
          return card;
        });
        BRAND_LOG.push({label:src.label,n:cards.length,msg:""});
        return cards;
      })
      .catch(function(e){ BRAND_LOG.push({label:src.label,n:0,msg:e.message}); console.warn("[브랜드 로드 실패] "+src.key+" · "+e.message); return []; });
  });
  return Promise.all(jobs).then(function(res){
    var added=0;
    res.forEach(function(cards){
      cards.forEach(function(c){
        if(!c||!c.name||byName[c.name]) return;
        if(BRAND_VIDEOS[c.name]&&!(c.videos&&c.videos.length)) c.videos=BRAND_VIDEOS[c.name];
        byName[c.name]=c; added++;   /* 상황별 응대 연결 전용 — 과목별(1~10) 목록에는 넣지 않음 */
        (c.aliases||[]).forEach(function(a){a=(a||"").trim();if(a&&!byName[a])byName[a]=c;});
      });
    });
    if(added){
      var vs=document.getElementById('viewSit');
      if(vs){ renderSit(); vs.dataset.built="1"; }   /* 지연 로드된 브랜드 제품까지 버튼으로 연결 */
    }
    showBrandStatus();
    console.log("[브랜드 카탈로그] 상황별 연결 "+added+"개 추가 · 과목별 "+PRODUCTS.length+"개 · byName 총 "+Object.keys(byName).length);
    /* 상황별 응대에서 참조하는 제품 중 아직 없는 이름을 콘솔에 알린다 */
    try{
      var miss=[];
      SIT.forEach(function(g){g.items.forEach(function(it){(it.rec||[]).forEach(function(n){
        if(!byName[n] && miss.indexOf(n)<0) miss.push(n);
      });});});
      if(miss.length) console.warn("[응대 연결 안 된 제품] "+miss.join(" / "));
    }catch(e){}
    return added;
  });
}

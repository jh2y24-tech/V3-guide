<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>형제상사 · 제품 교육 핸드북 (직원용)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/gh/webfontworld/gmarket/GmarketSans.css" rel="stylesheet" />
<style>
:root{
  --brand:#004750;--brand-2:#00343B;--brand-3:#1E6069;--brand-tint:#E2EDEC;--brand-tint2:#D2E3E2;
  --ink:#10262A;--ink-soft:#56686B;--paper:#EFF3F2;--surface:#FFFFFF;--line:#D7E0DE;
  --signal:#D97A16;--signal-ink:#7A4106;--signal-bg:#FBEBD3;--signal-bd:#F0CE9B;
  --warn-bg:#FDF3E7;--warn-bd:#F0D3AC;--focus:#1573E6;--ok:#0F7A5A;
  --r-lg:20px;--r-md:14px;--r-sm:9px;
  --shadow-card:0 1px 2px rgba(0,71,80,.05),0 10px 30px rgba(0,71,80,.06);
  --shadow-pop:0 24px 70px rgba(0,40,45,.30);--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"GmarketSans","Pretendard Variable",Pretendard,system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
/* header */
.top{background:rgba(239,243,242,.92)}
.top-inner{max-width:1180px;margin:0 auto;padding:15px clamp(14px,3.5vw,34px) 4px}
.subbar{background:rgba(239,243,242,.92)}
.subbar-inner{max-width:1180px;margin:0 auto;padding:11px clamp(14px,3.5vw,34px) 13px}
.brand{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.brand img{height:clamp(28px,4vw,38px);width:auto;display:block}
.brand .divider{width:1px;height:24px;background:var(--line)}
.brand .sub{font-size:clamp(14px,1.9vw,16px);font-weight:700;color:var(--brand);letter-spacing:-.01em}
.brand .hb{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brand-3);border:1px solid var(--brand-tint2);background:var(--surface);padding:3px 9px;border-radius:6px;letter-spacing:.03em}
.searchwrap{position:relative;display:flex;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;box-shadow:var(--shadow-card);transition:border-color .16s}
.searchwrap:focus-within{border-color:var(--brand)}
.searchwrap svg{width:22px;height:22px;margin-left:16px;flex:none;color:var(--brand-3)}
.searchwrap input{flex:1;border:0;outline:0;background:transparent;font-size:clamp(15px,2vw,17px);font-weight:500;padding:14px 14px;color:var(--ink);min-width:0}
.searchwrap input::placeholder{color:#94A2A1}
.searchwrap .x{display:none;border:0;background:var(--brand-tint);color:var(--brand);width:32px;height:32px;border-radius:50%;margin-right:10px;font-size:18px;cursor:pointer;flex:none}
.searchwrap.on .x{display:grid;place-items:center}
.ac{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-pop);padding:6px;z-index:60;display:none;max-height:344px;overflow:auto}
.ac.on{display:block}
.ac-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;font-family:inherit;font-size:14.5px;color:var(--ink);padding:10px 11px;border-radius:9px;cursor:pointer}
.ac-item:hover,.ac-item.active{background:var(--brand-tint)}
.ac-ic{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:7px;background:var(--paper);color:var(--brand-3)}
.ac-ic svg{width:15px;height:15px}
.ac-tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-tx b{font-weight:800;color:var(--brand-2)}
.ac-badge{flex:none;font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.ac-head{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--ink-soft);padding:9px 11px 3px}
/* tabs */
.tabs{display:flex;gap:8px;margin-top:13px}
.tab{flex:1;display:flex;flex-direction:column;gap:2px;align-items:flex-start;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;cursor:pointer;font-family:inherit;text-align:left;transition:all .15s}
.tab b{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.tab span{font-size:12px;color:var(--ink-soft);font-weight:500}
.tab[aria-selected="true"]{background:linear-gradient(90deg,#00343B 0%,#2E8189 100%);border-color:var(--brand)}
.tab[aria-selected="true"] b{color:#fff}
.tab[aria-selected="true"] span{color:var(--brand-tint)}
/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:12px clamp(14px,3.5vw,34px) 90px}
.view{display:none}
.view.on{display:block}
/* ===== 과목별 학습 ===== */
.catbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:9px 2px 11px;margin-bottom:8px;background:var(--paper);box-shadow:0 7px 8px -7px rgba(0,71,80,.16)}
.catbar::-webkit-scrollbar{display:none}
.catbar button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);font-family:inherit;font-size:14px;font-weight:700;color:var(--ink-soft);padding:12px 10px;border-radius:12px;cursor:pointer;transition:all .14s;white-space:nowrap;box-shadow:0 1px 2px rgba(0,71,80,.04)}
.catbar button .n{font-family:var(--mono);font-size:11px;font-weight:700;color:#9FB0AE;background:var(--paper);border-radius:20px;padding:1px 7px}
.catbar button:hover{border-color:var(--brand-3);color:var(--ink)}
.catbar button[aria-current="true"]{background:linear-gradient(90deg,#1E6069 0%,#78BEC4 100%);color:#fff;border-color:var(--brand);box-shadow:0 4px 14px rgba(0,71,80,.22)}
.catbar button[aria-current="true"] .n{color:#fff;background:rgba(255,255,255,.18)}
.panel-head{display:flex;align-items:center;gap:13px;margin-bottom:4px}
.panel-num{font-family:var(--mono);font-weight:700;font-size:13px;color:#fff;background:linear-gradient(90deg,#1E6069 0%,#78BEC4 100%);border-radius:9px;padding:7px 12px;flex:none}
.panel-title{font-family:"GmarketSans",sans-serif;font-size:clamp(23px,3.8vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.2}
.panel-intro{font-size:15.5px;color:var(--ink-soft);line-height:1.7;margin:14px 0 18px;max-width:78ch}
.count-line{font-family:var(--mono);font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:18px;letter-spacing:.02em;word-break:keep-all}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:18px}
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;cursor:pointer;box-shadow:var(--shadow-card);transition:transform .16s,box-shadow .16s,border-color .16s;text-align:left;font-family:inherit;padding:0}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-pop);border-color:var(--brand-tint2)}
.pcard:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pcard-thumb{aspect-ratio:4/3;width:100%;object-fit:contain;background:#fff;border-bottom:1px solid var(--line);padding:12px;display:block}
.pcard-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:11px;flex:1}
.pcard-name{font-size:18.5px;font-weight:800;letter-spacing:-.02em;line-height:1.3;color:var(--ink)}
.pcard-spec{display:inline-block;align-self:flex-start;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--brand-3);background:var(--brand-tint);border:1px solid var(--brand-tint2);padding:5px 11px;border-radius:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-stats{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:3px}
.pstat{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #EEF3F2;font-size:12.5px;line-height:1.5}
.pstat:last-child{border-bottom:0}
.pstat .pk{flex:none;width:52px;font-weight:700;color:var(--brand-3)}
.pstat .pv{font-family:var(--mono);font-weight:600;color:var(--ink);word-break:keep-all}
.pcard-use{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin-top:auto}
.pcard-go{font-size:13px;font-weight:800;color:var(--brand);opacity:.85}
.pcard:hover .pcard-go{opacity:1}
.dash{color:#B7C4C2}
/* ===== 상황별 응대 ===== */
.sit-intro{font-size:15px;color:var(--ink-soft);line-height:1.6;margin-bottom:22px;max-width:72ch}
.sit-group{margin-bottom:30px}
.sit-gt{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;color:var(--brand);margin-bottom:14px;letter-spacing:-.01em}
.sit-gt::before{content:"";width:5px;height:18px;background:var(--brand);border-radius:3px}
.sit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sit-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 19px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:13px}
.sit-q{position:relative;font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.5;padding-left:30px;letter-spacing:-.01em}
.sit-q::before{content:"\201C";position:absolute;left:0;top:-6px;font-family:Georgia,serif;font-size:34px;color:var(--brand-tint2);line-height:1}
.sit-ans{display:flex;flex-direction:column;gap:9px;border-top:1px dashed var(--line);padding-top:13px}
.sit-lead{font-size:11.5px;font-weight:700;color:var(--brand-3);letter-spacing:.03em}
.rec{display:flex;flex-wrap:wrap;gap:7px}
.rec button{border:0;color:#fff;font-family:inherit;font-size:13.5px;font-weight:800;padding:7px 13px;border-radius:9px;cursor:pointer;transition:all .14s;letter-spacing:-.01em}
.rec button:hover{filter:brightness(1.08);color:#fff}
.method .term{display:inline-block;border:0;background:var(--brand);color:#fff;font-family:inherit;font-weight:800;font-size:.9em;line-height:1.3;padding:0 9px;border-radius:999px;cursor:pointer;vertical-align:baseline;margin:0 1px;box-shadow:0 1px 2px rgba(0,71,80,.18)}
.method .term::after{content:'↗';font-size:.82em;margin-left:2px;opacity:.85}
.method .term:hover{filter:brightness(1.12)}
.primer-box{background:#F1F6F5;border:1px solid #D2E3E2;border-radius:14px;padding:14px 16px}
.primer-box .primer-note{margin:0 0 11px;font-size:14px;color:#22383B;line-height:1.62}
.primer-box .primer-note:last-child{margin-bottom:0}
.plink{display:inline-flex;align-items:center;gap:5px;border:0;background:var(--brand);color:#fff;font-family:inherit;font-weight:800;font-size:14px;line-height:1.3;padding:10px 16px;border-radius:10px;cursor:pointer;box-shadow:0 1px 2px rgba(0,71,80,.18)}
.plink::after{content:'↗';font-size:.85em;opacity:.85}
.plink:hover{filter:brightness(1.12)}
.rec button.first{color:#fff}
.rec button.first:hover{filter:brightness(1.08)}
.why{font-size:13px;color:var(--ink-soft);line-height:1.55}
.sit-ref{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--brand-3);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 11px;transition:.15s}
.sit-ref:hover{background:var(--brand-3);color:#fff;border-color:var(--brand-3)}
/* ===== search results ===== */
.sr-list{display:flex;flex-direction:column;gap:10px}
.sr-item{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow-card);transition:border-color .14s,transform .14s;text-align:left;width:100%;font-family:inherit}
.sr-item:hover{border-color:var(--brand-3);transform:translateY(-2px)}
.sr-cat{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--brand-3);border-radius:6px;padding:4px 9px;flex:none}
.sr-name{font-weight:800;font-size:15.5px;letter-spacing:-.01em}
.sr-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.sr-go{margin-left:auto;color:var(--brand-3);font-weight:700}
.empty{text-align:center;padding:70px 20px;color:var(--ink-soft)}
.empty img{width:64px;opacity:.7;margin-bottom:16px}
.empty .big{font-size:19px;font-weight:800;color:var(--ink);margin-bottom:6px}
/* ===== detail overlay (제품 학습 카드) ===== */
.overlay{position:fixed;inset:0;z-index:80;display:none;background:rgba(6,24,27,.55);backdrop-filter:blur(3px);align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.detail{background:var(--surface);width:100%;max-width:860px;max-height:94vh;overflow-y:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-pop);animation:slideUp .26s cubic-bezier(.16,1,.3,1);position:relative}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.detail-head{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);z-index:3;display:flex;justify-content:flex-end;padding:12px 12px 0}
.detail-close{border:0;background:var(--brand-tint);width:44px;height:44px;border-radius:50%;font-size:23px;color:var(--brand);cursor:pointer;line-height:1}
.detail-close:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.detail-body{padding:2px clamp(18px,4vw,38px) 44px}
.d-hero{width:100%;aspect-ratio:3/2;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:20px;padding:8px}
.d-cat{font-size:13px;font-weight:800;color:var(--brand);letter-spacing:.02em}
.d-name{font-family:"GmarketSans",sans-serif;font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em;margin:4px 0 8px;line-height:1.15}
.d-one{font-size:16px;color:var(--ink);font-weight:600;line-height:1.55;background:var(--brand-tint);border-left:5px solid var(--brand);border-radius:0 12px 12px 0;padding:14px 18px;margin:14px 0 22px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.spec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.spec .k{font-size:12px;font-weight:700;color:var(--brand-3)}
.spec .v{font-family:var(--mono);font-weight:700;font-size:15px;margin-top:4px;line-height:1.35;color:var(--ink)}
.info{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.info>div{font-size:13px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);padding:7px 12px;border-radius:9px}
.info b{color:var(--ink);font-family:var(--mono);font-weight:600;margin-left:3px}
.pdf-btn{display:flex;align-items:center;gap:10px;width:100%;margin:16px 0 4px;border:1.5px solid var(--brand);background:var(--surface);color:var(--brand);font-family:inherit;font-weight:800;font-size:14.5px;padding:13px 16px;border-radius:12px;cursor:pointer}
.pdf-btn svg{width:19px;height:19px}
.pdf-btn .arw{margin-left:auto}
.sec{margin-top:26px}
.sec h3{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;color:var(--brand);margin-bottom:13px}
.sec h3::before{content:"";width:4px;height:16px;background:var(--brand);border-radius:2px}
.desc-p{font-size:15px;color:#2C3B3D;line-height:1.65}
.uses-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 17px;font-size:14.5px;color:#2C3B3D;line-height:1.6}
.method{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--surface)}
.method>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;font-size:15px;color:var(--ink);display:flex;align-items:center;justify-content:space-between}
.method>summary::-webkit-details-marker{display:none}
.method .arw{color:var(--brand-3);transition:transform .18s}
.method[open] .arw{transform:rotate(90deg)}
.method ol{margin:0;padding:2px 20px 16px 42px;display:flex;flex-direction:column;gap:9px}
.method ol li{font-size:14.5px;color:#2C3B3D;line-height:1.6;padding-left:4px}
.method ol li::marker{color:var(--brand);font-family:var(--mono);font-weight:700}
.cautions{list-style:none;background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:12px;padding:8px 16px}
.cautions li{position:relative;padding:9px 0 9px 26px;font-size:14px;color:#5A4321;line-height:1.55;border-bottom:1px solid rgba(240,211,172,.5)}
.cautions li:last-child{border-bottom:0}
.cautions li::before{content:"!";position:absolute;left:0;top:9px;width:17px;height:17px;background:var(--signal);color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:grid;place-items:center}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 4px}
.tags span{font-size:12.5px;font-weight:700;color:var(--brand);background:var(--brand-tint);padding:6px 12px;border-radius:999px}
/* to-top */
.to-top{position:fixed;right:18px;bottom:18px;z-index:90;width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(90deg,#00343B 0%,#2E8189 100%);color:#fff;box-shadow:0 6px 20px rgba(0,40,45,.35);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;display:grid;place-items:center}
.to-top.show{opacity:1;pointer-events:auto;transform:none}
.alt-fab{position:fixed;left:16px;bottom:20px;z-index:95;max-width:min(560px,calc(100vw - 92px));display:none;align-items:center;gap:9px;padding:13px 19px;border:0;border-radius:999px;background:linear-gradient(90deg,#0B7A3E 0%,#18A85B 100%);color:#fff;font-family:inherit;font-size:14.5px;font-weight:800;box-shadow:0 8px 22px rgba(11,90,50,.42);cursor:pointer;text-align:left;line-height:1.3}
.alt-fab.show{display:inline-flex}
.alt-fab .af-ic{flex:none;font-size:17px;line-height:1}
.alt-fab .af-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.altrec{background:#EAF7EF;border:1px solid #B7E3C7;border-radius:14px;padding:13px 15px;margin:8px 0 4px}
.altrec-h{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:800;color:#0B5A32}
.altrec-badge{flex:none;background:#0B7A3E;color:#fff;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.altrec-note{margin:9px 0 11px;font-size:13.5px;font-weight:600;color:#245038;line-height:1.6}
.altrec-btns{display:flex;flex-wrap:wrap;gap:8px}
.altrec-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #0B7A3E;color:#0B5A32;font-family:inherit;font-size:14px;font-weight:800;padding:10px 15px;border-radius:11px;cursor:pointer}
.altrec-chip .arw{font-weight:800}
.to-top:hover{background:var(--brand-2)}
.to-top svg{width:25px;height:25px}
/* viewer */
.viewer{position:fixed;inset:0;z-index:95;display:none;flex-direction:column;background:rgba(6,24,27,.7)}
.viewer.open{display:flex}
.viewer-bar{display:flex;align-items:center;gap:12px;padding:13px 18px;background:linear-gradient(90deg,#00343B 0%,#2E8189 100%);color:#fff}
.viewer-bar b{font-size:15px;font-weight:700;flex:1}
.viewer-bar button{border:0;background:rgba(255,255,255,.16);color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
.viewer-open{border:0;background:rgba(255,255,255,.16);color:#fff;font-family:inherit;font-size:13px;font-weight:700;text-decoration:none;padding:8px 13px;border-radius:8px;white-space:nowrap}
.viewer-open:hover{background:rgba(255,255,255,.28)}
.pdf-scroll{flex:1;overflow:auto;background:#59696C;padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px;-webkit-overflow-scrolling:touch}
.pdf-scroll canvas{width:100%;max-width:900px;height:auto;background:#fff;border-radius:5px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.pdf-load{color:#E6EEEC;font-size:14px;font-weight:600;text-align:center;padding:40px 24px;line-height:1.6}
@media (min-width:760px){.overlay{align-items:center;padding:24px}.detail{border-radius:var(--r-lg)}}
@media (max-width:820px){
  .tab span{display:none}
  .catbar{gap:6px}
  .catbar button{font-size:11.5px;padding:10px 5px;border-radius:10px;gap:4px}
  .catbar button .n{display:none}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .pcard-body{padding:13px 14px 15px;gap:9px}
  .pcard-name{font-size:16px}
}
/* ===== 시공 가이드 선택영역 ===== */
.guides{margin-top:14px;border-top:1px solid var(--line);padding-top:16px}
.guides-t{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--brand-3);letter-spacing:.12em;margin-bottom:13px;text-transform:uppercase}
.guides-t::before,.guides-t::after{content:"";height:1px;width:30px;background:var(--line)}
.guide-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.guide-btn{display:flex;flex-direction:column;gap:7px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px 17px;font-family:inherit;text-align:left;cursor:pointer;color:var(--ink);position:relative;overflow:hidden;transition:border-color .15s,transform .15s,box-shadow .15s;text-decoration:none}
.guide-btn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);opacity:0;transition:opacity .15s}
.guides .guide-btns .guide-btn:hover{background:linear-gradient(90deg,#00343B 0%,#2E8189 100%)!important;border-color:transparent;transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,45,50,.18)}
.guide-btn:hover>span:first-child{color:#fff}
.guide-btn:hover .gb-desc{color:rgba(255,255,255,.92)}
.guide-btn:hover::before{opacity:0}
.guide-btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.guide-btn>span:first-child{font-family:"GmarketSans",sans-serif;font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--brand)}
.guide-btn .gb-desc{font-size:12.5px;font-weight:500;color:var(--ink-soft);line-height:1.5;white-space:pre-line}
.guide-btn.feature{background:linear-gradient(180deg,var(--brand-tint),var(--surface))}
.guide-btns .guide-btn:nth-child(2),.guide-btns .guide-btn:nth-child(3),.guide-btns .guide-btn:nth-child(4){background:linear-gradient(180deg,var(--brand-tint),var(--surface))}
.guide-btn.soon>span:first-child::after{content:"준비중";margin-left:7px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--brand-3);background:var(--brand-tint);border-radius:5px;padding:2px 6px;vertical-align:middle;letter-spacing:0}
@media (max-width:820px){.guide-btns{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.guide-btns{grid-template-columns:1fr}}
.gview{position:fixed;inset:0;z-index:96;display:none;flex-direction:column;background:#fff}
.gview.open{display:flex}
.gview-bar{display:flex;align-items:center;gap:12px;padding:13px 18px;background:linear-gradient(90deg,#00343B 0%,#2E8189 100%);color:#fff}
.gview-bar b{font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gview-bar a{color:#fff;font-size:13px;font-weight:700;text-decoration:none;opacity:.92;white-space:nowrap}
.gview-bar button{border:0;background:rgba(255,255,255,.18);color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.gview iframe{flex:1;width:100%;border:0}

.rec button.pending{background-image:none!important;background:#E7ECEB!important;color:#8C9A98!important;cursor:default;box-shadow:none;}
.doc-links{display:flex;flex-direction:column;gap:8px;margin:10px 0;}

ius:12px;padding:12px 16px;margin:0 0 14px;color:#2A4E52;font-size:13.5px;line-height:1.6"><span style="flex:none;font-weight:800;color:#004750">※</span><span>누전차단기는 사람이 전기에 접촉하여 누설전류가 발생하면 <b>매우 빠르게 차단</b>하여 인체를 보호합니다.</span></div><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;padding:16px 18px;margin:0 0 12px"><div style="font-weight:800;font-size:15.5px;color:#10262A;margin-bottom:7px">주택용 vs 산업용 차단기</div><div style="font-size:14.5px;color:#2C3B3D;line-height:1.6">일반적으로 <b>주택용 누전차단기</b>는 감도전류 15~30mA 정도, <b>산업용</b>은 설비 특성에 따라 30·100·200·500mA 등 다양합니다. 산업현장은 기계의 정상적인 누설전류가 많아 불필요한 차단을 막으려고 감도를 낮게 두기도 합니다.<br><br>→ 주택용 = <b>인체 보호 중심, 감도 높음</b> / 산업용 = <b>설비 운전 안정성 고려, 감도가 상대적으로 낮은 경우가 많음</b>. 즉 주택용이 산업용보다 민감해 더 빠르게 작동한다고 이해하면 됩니다. 주택법 제정으로 <b>2017년 이후 건설된 주택은 주택용 차단기를 사용</b>해야 합니다.</div></div><div style="display:flex;align-items:center;gap:8px;margin:30px 0 14px"><span style="width:4px;height:16px;background:#004750;border-radius:2px"></span><h3 style="font-size:17px;font-weight:800;color:#004750;margin:0">2. 전력 계산식</h3></div><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65">전력 계산식은 <b>P = V × I</b> 입니다. (P: 전력 W, V: 전압 V, I: 전류 A) 한국 가정용 전압은 일반적으로 220V입니다.</p><div style="font-weight:800;font-size:15px;color:#10262A;margin:0 0 8px">차단기별 용량 (220V 기준)</div><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:0 0 14px"><div style="display:grid;grid-template-columns:1fr 1fr;font-size:14.5px"><div style="padding:12px 15px;background:#EDF3F2;font-weight:700;color:#1E6069;border-bottom:1px solid #D7E0DE">15A 차단기</div><div style="padding:12px 15px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#10262A;border-bottom:1px solid #D7E0DE">220V × 15A = 3,300W = 3.3kW</div><div style="padding:12px 15px;background:#EDF3F2;font-weight:700;color:#1E6069;border-bottom:1px solid #D7E0DE">20A 차단기</div><div style="padding:12px 15px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#10262A;border-bottom:1px solid #D7E0DE">220V × 20A = 4,400W = 4.4kW</div><div style="padding:12px 15px;background:#EDF3F2;font-weight:700;color:#1E6069;">30A 차단기</div><div style="padding:12px 15px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#10262A;">220V × 30A = 6,600W = 6.6kW</div></div></div><div style="display:flex;align-items:center;gap:8px;margin:30px 0 14px"><span style="width:4px;height:16px;background:#004750;border-radius:2px"></span><h3 style="font-size:17px;font-weight:800;color:#004750;margin:0">3. 전선 두께</h3></div><div style="font-weight:800;font-size:15px;color:#10262A;margin:0 0 8px">차단기별 표준 전선 굵기</div><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:0 0 14px"><div style="display:grid;grid-template-columns:1fr 1fr;font-size:14.5px"><div style="padding:12px 15px;background:#EDF3F2;font-weight:700;color:#1E6069;border-bottom:1px solid #D7E0DE">20A</div><div style="padding:12px 15px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#10262A;border-bottom:1px solid #D7E0DE">2.5 SQ</div><div style="padding:12px 15px;background:#EDF3F2;font-weight:700;color:#1E6069;border-bottom:1px solid #D7E0DE">30A</div><div style="padding:12px 15px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#10262A;border-bottom:1px solid #D7E0DE">4 SQ</div><div style="padding:12px 15px;background:#EDF3F2;font-weight:700;color:#1E6069;">40A</div><div style="padding:12px 15px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#10262A;">6 SQ</div></div></div><div style="display:flex;gap:10px;align-items:flex-start;background:#E2EDEC;border:1px solid #D2E3E2;border-radius:12px;padding:12px 16px;margin:0 0 14px;color:#2A4E52;font-size:13.5px;line-height:1.6"><span style="flex:none;font-weight:800;color:#004750">※</span><span>거리·온도 등 발열이 높아지는 환경 조건을 함께 고려해 선정해야 합니다. 거리가 멀수록 전압강하가 일어나므로, 예를 들어 20A에 2.5SQ를 표준으로 쓰더라도 <b>거리가 40M 이상이면 전선 두께를 4SQ로 올려야</b> 합니다.</span></div><div style="display:flex;align-items:center;gap:8px;margin:30px 0 14px"><span style="width:4px;height:16px;background:#004750;border-radius:2px"></span><h3 style="font-size:17px;font-weight:800;color:#004750;margin:0">4. 실제 사용 권장 용량</h3></div><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65">차단기 정격을 100% 계속 사용하는 것은 <b>화재 위험</b>이 있어 권장되지 않습니다. 여유를 두고 70~80% 수준으로 쓰는 것이 발열과 과부하를 줄이는 데 유리합니다.</p><div style="font-weight:800;font-size:15px;color:#10262A;margin:0 0 8px">정격 대비 권장 사용량 (약 80%)</div><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:0 0 14px"><div style="display:grid;grid-template-columns:1fr 1fr;font-size:14.5px"><div style="padding:12px 15px;background:#EDF3F2;font-weight:700;color:#1E6069;border-bottom:1px solid #D7E0DE">15A · 3.3kW</div><div style="padding:12px 15px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#10262A;border-bottom:1px solid #D7E0DE">약 2.6kW</div><div style="padding:12px 15px;background:#EDF3F2;font-weight:700;color:#1E6069;border-bottom:1px solid #D7E0DE">20A · 4.4kW</div><div style="padding:12px 15px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#10262A;border-bottom:1px solid #D7E0DE">약 3.5kW</div><div style="padding:12px 15px;background:#EDF3F2;font-weight:700;color:#1E6069;">30A · 6.6kW</div><div style="padding:12px 15px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#10262A;">약 5.3kW</div></div></div><div style="display:flex;gap:10px;align-items:flex-start;background:#E2EDEC;border:1px solid #D2E3E2;border-radius:12px;padding:12px 16px;margin:0 0 14px;color:#2A4E52;font-size:13.5px;line-height:1.6"><span style="flex:none;font-weight:800;color:#004750">※</span><span>실제 허용 부하는 전선 굵기, 배선 방식, 주변 온도, 연속 사용 시간 등을 함께 고려해야 합니다.</span></div><div style="display:flex;align-items:center;gap:8px;margin:30px 0 14px"><span style="width:4px;height:16px;background:#004750;border-radius:2px"></span><h3 style="font-size:17px;font-weight:800;color:#004750;margin:0">5. 콘센트 배선 공사 순서</h3></div><ol style="font-size:14.5px;color:#2C3B3D;line-height:1.6;margin:0 0 14px;padding-left:22px"><li style="margin:0 0 7px;padding-left:4px">철근 공사 시 전기박스(철박스, PVC 박스) 설치</li><li style="margin:0 0 7px;padding-left:4px">박스에 커넥터 체결</li><li style="margin:0 0 7px;padding-left:4px">CD관 또는 전선관(16mm, 전선 가닥이 많으면 22mm) 연결</li><li style="margin:0 0 7px;padding-left:4px">콘크리트 타설</li><li style="margin:0 0 7px;padding-left:4px">양생 후 전선 입선</li><li style="margin:0 0 7px;padding-left:4px">콘센트 및 스위치 결선</li><li style="margin:0 0 7px;padding-left:4px">절연·접지·동작 시험</li><li style="margin:0 0 7px;padding-left:4px">전선관 안으로 전선 3가닥이 입선되어 들어감</li></ol><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:14px 0"><img src="images/elec-02.jpg" alt="전기 배선 안내 2" style="display:block;width:100%;height:auto" onerror="this.parentNode.style.display='none'" /></div><p style="margin:-6px 2px 14px;font-size:12.5px;color:#56686B;text-align:center">철근 공사 단계에서 전기박스와 전선관을 미리 설치한 현장</p><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65">윗부분은 건너뛰어도 되지만, 저희 매장에서 <b>전선관·박스·커넥터·커플링</b> 등을 판매하고 있어 이해를 돕기 위해 첨부합니다. 저희 매장에는 철박스가 아닌 아래 제품(커넥터 박스)으로 설치되어 있습니다.</p><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:14px 0"><img src="images/elec-03.jpg" alt="전기 배선 안내 3" style="display:block;width:100%;height:auto" onerror="this.parentNode.style.display='none'" /></div><p style="margin:-6px 2px 14px;font-size:12.5px;color:#56686B;text-align:center">매장에서 사용하는 커넥터 박스</p><div style="display:flex;align-items:center;gap:8px;margin:30px 0 14px"><span style="width:4px;height:16px;background:#004750;border-radius:2px"></span><h3 style="font-size:17px;font-weight:800;color:#004750;margin:0">6. 주택용 콘센트 배선</h3></div><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65">각 분기 차단기마다 담당하는 곳이 있습니다. <b>전열 1·2·3</b>은 방 라인별 콘센트, <b>전등</b>은 조명, <b>파란색(고감도) 차단기</b>는 습기가 많은 화장실 등에 더 빨리 작동하도록 설치됩니다.</p><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:14px 0"><img src="images/elec-04.jpg" alt="전기 배선 안내 4" style="display:block;width:100%;height:auto" onerror="this.parentNode.style.display='none'" /></div><p style="margin:-6px 2px 14px;font-size:12.5px;color:#56686B;text-align:center">분기 차단기별로 배선된 분전함</p><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65">일반적인 단상 220V 콘센트 회로는 <b>L(상선·활선), N(중성선), 녹색(접지선)</b> 총 3가닥을 사용하며, 전선은 보통 2.5㎟(SQ), 필요 시 4㎟(SQ)를 씁니다. 적색·백색·녹색선이 콘센트 박스에 체결된 전선관 안으로 요비선을 사용해 입선되어 들어가고, 분전함에서 나와 차단기로부터 전원을 공급받습니다. 콘센트 박스 안에는 3가닥이 있으며, 아래 사진처럼 연결하면 됩니다.</p><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:14px 0"><img src="images/elec-05.jpg" alt="전기 배선 안내 5" style="display:block;width:100%;height:auto" onerror="this.parentNode.style.display='none'" /></div><p style="margin:-6px 2px 14px;font-size:12.5px;color:#56686B;text-align:center">콘센트 뒷면 결선 — 같은 색끼리, 녹색은 접지 자리에</p><div style="background:#FDF3E7;border:1px solid #F0D3AC;border-radius:12px;padding:6px 16px 8px;margin:14px 0"><div style="font-weight:800;color:#B45309;font-size:14px;padding:10px 0 2px 2px">⚠ 감전·합선 주의 — 반드시 차단기를 내리고 작업</div><ul style="list-style:none;margin:0;padding:0"><li style="position:relative;padding:8px 0 8px 26px;font-size:14px;color:#5A4321;line-height:1.6"><span style="position:absolute;left:0;top:8px;width:17px;height:17px;background:#D97A16;color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:grid;place-items:center">!</span>차단기는 <b>항시 내리고</b> 작업해야 합니다.</li><li style="position:relative;padding:8px 0 8px 26px;font-size:14px;color:#5A4321;line-height:1.6"><span style="position:absolute;left:0;top:8px;width:17px;height:17px;background:#D97A16;color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:grid;place-items:center">!</span>같은 선은 같은 곳에 끼우고, <b>녹색(접지)은 반드시 녹색 자리</b>에 끼웁니다.</li><li style="position:relative;padding:8px 0 8px 26px;font-size:14px;color:#5A4321;line-height:1.6"><span style="position:absolute;left:0;top:8px;width:17px;height:17px;background:#D97A16;color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:grid;place-items:center">!</span>녹색이 백색이나 적색에 닿으면 <b>차단기가 떨어집니다.</b></li><li style="position:relative;padding:8px 0 8px 26px;font-size:14px;color:#5A4321;line-height:1.6"><span style="position:absolute;left:0;top:8px;width:17px;height:17px;background:#D97A16;color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:grid;place-items:center">!</span>백색과 적색이 닿으면 <b>합선</b>이 일어납니다. 뺀찌에 구멍이 날 정도로 강하고, 직접 보면 잠시 앞이 안 보일 만큼 강한 섬광과 화상 위험이 있습니다. 반드시 차단기를 내리고 작업하세요.</li></ul></div><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:14px 0"><img src="images/elec-06.jpg" alt="전기 배선 안내 6" style="display:block;width:100%;height:auto" onerror="this.parentNode.style.display='none'" /></div><p style="margin:-6px 2px 14px;font-size:12.5px;color:#56686B;text-align:center">노출 접지 2구 콘센트</p><div style="display:flex;align-items:center;gap:8px;margin:30px 0 14px"><span style="width:4px;height:16px;background:#004750;border-radius:2px"></span><h3 style="font-size:17px;font-weight:800;color:#004750;margin:0">7. 접지</h3></div><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65"><b>접지</b>는 누전이나 고장 시 전기를 안전하게 땅으로 흘려보내는 역할을 합니다. 땅에는 접지봉을 박고, 접지봉에 GV전선을 연결하여 분전함 접지단자대에 연결합니다. 녹색선이라고 생각하면 됩니다.</p><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:14px 0"><img src="images/elec-07.jpg" alt="전기 배선 안내 7" style="display:block;width:100%;height:auto" onerror="this.parentNode.style.display='none'" /></div><p style="margin:-6px 2px 14px;font-size:12.5px;color:#56686B;text-align:center">땅에 박는 접지봉과 접지선(녹색)</p><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65">접지는 콘센트에만 있는 것이 아니라 플러그에도 있습니다. 가운데 노란 부분이 접지이며, 이 부분이 없으면 <b>무접지 플러그</b>라고 생각하면 됩니다.</p><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:14px 0"><img src="images/elec-08.jpg" alt="전기 배선 안내 8" style="display:block;width:100%;height:auto" onerror="this.parentNode.style.display='none'" /></div><p style="margin:-6px 2px 14px;font-size:12.5px;color:#56686B;text-align:center">접지(노란 부분)가 있는 플러그</p><div style="display:flex;align-items:center;gap:8px;margin:30px 0 14px"><span style="width:4px;height:16px;background:#004750;border-radius:2px"></span><h3 style="font-size:17px;font-weight:800;color:#004750;margin:0">8. 스위치·전등 배선</h3></div><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65">방·화장실·베란다 등 전등집의 콘크리트 타설 전 모습입니다. 16전선관(흑색)에 연결된 8각 철박스가 전등 집이라고 생각하면 됩니다. 스위치는 콘센트 배선과 방식이 다른 어려운 부분이라, 자세한 내용은 F동에 오시면 알려드립니다.</p><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:14px 0"><img src="images/elec-09.jpg" alt="전기 배선 안내 9" style="display:block;width:100%;height:auto" onerror="this.parentNode.style.display='none'" /></div><p style="margin:-6px 2px 14px;font-size:12.5px;color:#56686B;text-align:center">전등집(8각 철박스) — 콘크리트 타설 전</p><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65">일반적으로 조명기구에는 <b>상선(L)·중성선(N)·접지선(E)</b> 3가닥이 연결될 수 있습니다. 과거에는 조명기구 접지를 생략하는 경우가 많았지만, 금속 외함이 있는 조명기구는 접지를 하는 것이 원칙입니다. 분전반 분기차단기에서 나온 상선(L, 적색선)은 벽 스위치로 연결됩니다. 스위치는 상선을 차단·연결하는 역할을 하므로 회로는 <b>상선(L) → 스위치 → 조명기구 → 중성선(N)</b> 순으로 구성되고, 중성선(N)은 보통 스위치를 거치지 않고 조명기구에 직접 연결됩니다. 따라서 스위치를 켜면 상선이 조명기구에 공급되어 점등되고, 끄면 상선이 차단되어 소등됩니다.</p><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:14px 0"><img src="images/elec-10.jpg" alt="전기 배선 안내 10" style="display:block;width:100%;height:auto" onerror="this.parentNode.style.display='none'" /></div><p style="margin:-6px 2px 14px;font-size:12.5px;color:#56686B;text-align:center">스위치 회로 — 누전차단기·중성선·스위치·회로선</p><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65">2구 스위치의 경우, 가운데 테이프에 "내부 연결됨"이라 적혀 있으면 <b>점프 연결을 하지 않아도</b> 되고 적색 상시선 하나만 연결하면 됩니다. 차단기가 올라가 있으면 적색선은 활선 상태이고, 흑색·청색은 조명기구에서 받은 선입니다. 1구 스위치 1동작이면 2가닥이, 2구 스위치 2동작이면 3가닥이 내려오는 원리입니다.</p><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:14px 0"><img src="images/elec-11.jpg" alt="전기 배선 안내 11" style="display:block;width:100%;height:auto" onerror="this.parentNode.style.display='none'" /></div><p style="margin:-6px 2px 14px;font-size:12.5px;color:#56686B;text-align:center">2구 스위치 결선 — 적색(상시선) 하나, 흑·청색은 조명선</p><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65">예를 들어 스위치가 없고 3가닥(적·흑·청)만 나와 있어 흑·청색이 조명선인지 환풍기선인지 모를 때, 적색은 활선이므로 <b>적색+흑색</b>을 갖다 대면 조명·환풍기 중 하나가 작동합니다. 이렇게 "갖다댄다 / 떨어진다"가 스위치의 원리입니다.</p><div style="display:flex;align-items:center;gap:8px;margin:30px 0 14px"><span style="width:4px;height:16px;background:#004750;border-radius:2px"></span><h3 style="font-size:17px;font-weight:800;color:#004750;margin:0">9. 조명 설치</h3></div><div style="font-weight:800;font-size:15px;color:#10262A;margin:0 0 8px">공간별 LED 조명 용량 (참고)</div><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:0 0 14px"><div style="display:grid;grid-template-columns:1fr 1fr;font-size:14.5px"><div style="padding:12px 15px;background:#EDF3F2;font-weight:700;color:#1E6069;border-bottom:1px solid #D7E0DE">25W LED 방등</div><div style="padding:12px 15px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#10262A;border-bottom:1px solid #D7E0DE">원룸·작은 방 (약 5~8평)</div><div style="padding:12px 15px;background:#EDF3F2;font-weight:700;color:#1E6069;border-bottom:1px solid #D7E0DE">50W LED 방등</div><div style="padding:12px 15px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#10262A;border-bottom:1px solid #D7E0DE">안방·자녀방 (약 8~12평)</div><div style="padding:12px 15px;background:#EDF3F2;font-weight:700;color:#1E6069;">120W LED 거실등</div><div style="padding:12px 15px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#10262A;">거실 (약 15~25평 이상)</div></div></div><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65">천장에 3가닥 선이 나와 있는 1구 스위치의 예입니다. 보통 <b>흑색은 스위치</b>로, <b>백색은 N상(차단기에서 공급)</b>, <b>녹색은 접지</b>입니다.</p><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:14px 0"><img src="images/elec-12.jpg" alt="전기 배선 안내 12" style="display:block;width:100%;height:auto" onerror="this.parentNode.style.display='none'" /></div><p style="margin:-6px 2px 14px;font-size:12.5px;color:#56686B;text-align:center">천장에서 나온 3가닥 — 녹(접지)·백(N)·흑(스위치)</p><div style="background:#FDF3E7;border:1px solid #F0D3AC;border-radius:12px;padding:6px 16px 8px;margin:14px 0"><div style="font-weight:800;color:#B45309;font-size:14px;padding:10px 0 2px 2px">현장 확인 필수</div><ul style="list-style:none;margin:0;padding:0"><li style="position:relative;padding:8px 0 8px 26px;font-size:14px;color:#5A4321;line-height:1.6"><span style="position:absolute;left:0;top:8px;width:17px;height:17px;background:#D97A16;color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:grid;place-items:center">!</span>선의 역할이 항상 이렇지는 않습니다. 현장에서 각 선의 역할이 맞는지 반드시 확인해야 합니다. (드물지만 녹색이 2구 스위치용일 수도 있습니다.)</li></ul></div><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65">1구 스위치 연결은 <b>백색·흑색을 조명에서 나온 청색·갈색에 연결</b>하고 <b>녹색은 녹색끼리</b> 연결하면 작동합니다. 다만 1P단자는 빠지거나 접촉불량이 생길 확률이 높아 <b>와고(WAGO) 커넥터</b>를 추천합니다. 이번 F동 전등공사 때 1등 공신 상품이었습니다.</p><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:14px 0"><img src="images/elec-13.jpg" alt="전기 배선 안내 13" style="display:block;width:100%;height:auto" onerror="this.parentNode.style.display='none'" /></div><p style="margin:-6px 2px 14px;font-size:12.5px;color:#56686B;text-align:center">조명 결선 — 백·흑을 조명 청·갈색에, 녹은 녹끼리</p><div style="background:#fff;border:1px solid #D7E0DE;border-radius:14px;overflow:hidden;margin:14px 0"><img src="images/elec-14.jpg" alt="전기 배선 안내 14" style="display:block;width:100%;height:auto" onerror="this.parentNode.style.display='none'" /></div><p style="margin:-6px 2px 14px;font-size:12.5px;color:#56686B;text-align:center">와고(WAGO) 커넥터 — 1P단자보다 안정적인 결선</p><p style="font-size:15px;color:#2C3B3D;margin:0 0 13px;line-height:1.65">거실등 2구 스위치도 있는데, 이 부분은 직접 해보셔야 이해가 되므로 F동에 오시면 콘센트·스위치 등을 알려드립니다.</p><div style="margin-top:26px;background:#0B1416;border-radius:18px;padding:22px 22px"><div style="display:inline-block;border:1.5px solid #2C4E52;border-radius:999px;padding:6px 16px;font-size:12.5px;font-weight:700;color:#8FC7C4">읽고 오세요</div><p style="color:#CFE3E1;font-size:14.5px;line-height:1.7;margin:14px 0 0">위 내용을 전체 다 읽어보고 오세요. 전기는 처음 접하면 어렵고, 모르는 상태에서 접근하기 쉽지 않은 분야가 맞습니다. 이론만으로 100% 이해하기는 어렵습니다. 유튜브 실무 영상과 챗지피티 등을 검색하고, 전기업체를 운영하시는 사장님 고객께 문의하며 제가 아는 지식이 맞는지 의심하며 배웠습니다. 저희가 판매하는 제품에 대해서는 위에 정리된 내용 정도만 이해하셔도 <b style="color:#3FD0C9">제품 상담 및 선택에는 충분</b>하리라 생각합니다.</p></div></div>`;
